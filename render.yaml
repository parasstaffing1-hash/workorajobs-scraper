services:
  - type: web
    name: workorajobs
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn scripts.workora_app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: workora-jobs
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: alerts@workorajobs.com
    healthCheckPath: /api/health
    autoDeploy: true
