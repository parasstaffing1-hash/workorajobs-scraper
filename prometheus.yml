global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'leadflow-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: '/metrics'
    
  - job_name: 'leadflow-redis'
    static_configs:
      - targets: ['redis:6379']
    
  - job_name: 'leadflow-postgres'
    static_configs:
      - targets: ['postgres:5432']
