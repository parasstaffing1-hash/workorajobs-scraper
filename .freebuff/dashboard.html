", "content": "Comments", "author": "beyondloom.com via abhin4v", "published_at": "2026-08-14T09:10:45+00:00", "read": false, "starred": false, "full": false}, {"title": "Organic-looking brake assemblies debut on new Czinger 21C Spyder", "category": "news", "url": "https://arstechnica.com/cars/2026/08/czinger-debuts-topology-optimized-brakes-with-21c-spyder/", "source": "rss:Ars Technica", "summary": "Czinger used topological design and additive manufacturing to make the brakes.", "content": "Across California, it's time for Monterey Car Week, a cluster of events I once called \" Comic-Con and the Oscars but with wheels .\" For the last however many years, though, it's mostly felt like an accumulation of rich people and influencers all crammed into the now-traffic-snarled peninsula, each paying 10 times the normal price for five-night minimums in three-star motels. While being there in person is pretty far down the list of things I want to do these days, that doesn't mean there's no interesting news coming out of the event. And no, I'm not talking about that hideous collaboration between Singer and Louis Vuitton. I'm instead referring to the latest creation from Czinger. We first encountered Czinger's direct-metal laser-sintering technology a decade ago, before founder Kevin Czinger had even started the car company—at the time, it was still Divergent 3D. But what better way to show to the rest of the automotive industry that they should contract with you as a parts supplier than by making your own car? That was the idea behind Czinger (the company), and it's an approach that worked, as Divergent now has clients in the automotive sector as well as aerospace. And what a car it is : a hybrid with tandem seating and an ability to set new lap records should you have the skill. But the performance is less interesting than the engineering. Free of its body panels, the structure looks more organic than mechanical, with topology-optimized shapes that are lighter but no less ", "author": "Jonathan M. Gitlin", "published_at": "2026-08-14T07:01:15+00:00", "read": false, "starred": false, "full": true}, {"title": "Watch: What happens if Luigi Mangione pleads guilty today?", "category": "news", "url": "https://www.bbc.co.uk/news/videos/c36dyep3k1ko?at_medium=RSS&at_campaign=rss", "source": "rss:BBC World", "summary": "Attorneys for Mangione, who is accused of killing United Healthcare CEO Brian Thompson, are meeting federal prosecutors on Friday.", "content": "Attorneys for Mangione, who is accused of killing United Healthcare CEO Brian Thompson, are meeting federal prosecutors on Friday.", "author": "", "published_at": "2026-08-14T01:19:19+00:00", "read": false, "starred": false, "full": false}, {"title": "How to bring your software delivery workflow into GitHub with agent apps", "category": "blog", "url": "https://github.blog/ai-and-ml/github-copilot/how-to-bring-your-software-delivery-workflow-into-github-with-agent-apps/", "source": "scrape:github_blog", "summary": "See how four GitHub Agent Apps can help you scope, secure, roll out, and ship a feature across the SDLC–all without leaving GitHub.", "content": "Sam Zhang @im-samz Product Manager, GitHub Copilot", "author": "Sam Zhang", "published_at": "2026-08-14", "read": false, "starred": false, "full": true}, {"title": "Grok 4.6 is now available in GitHub Copilot", "category": "blog", "url": "https://github.blog/changelog/2026-08-14-grok-4-6-is-now-available-in-github-copilot", "source": "scrape:github_blog", "summary": "Grok 4.6, xAI’s latest reasoning model, is now rolling out in GitHub Copilot. It is designed for agentic coding and complex multi-step workflows. In our internal testing, Grok 4.6 showed…", "content": "Back to changelog Release August 14, 2026 • 1 minute read Grok 4.6 is now available in GitHub Copilot Table of Contents Availability in GitHub Copilot Enabling access Learn more Share your feedback Menu. Currently selected: Availability in GitHub Copilot Availability in GitHub Copilot Enabling access Learn more Share your feedback Grok 4.6, xAI’s latest reasoning model, is now rolling out in GitHub Copilot. It is designed for agentic coding and complex multi-step workflows. In our internal testing, Grok 4.6 showed strong results across terminal-based coding tasks in Visual Studio Code and Copilot CLI. It performed especially well on longer-horizon tasks requiring sustained reasoning and tool use, making it a strong fit for complex coding workflows. This model is billed at provider list pricing under usage-based billing. See GitHub Copilot’s pricing for models and requests for details. Availability in GitHub Copilot Grok 4.6 will be available to Copilot Pro, Pro+, Max, Business, and Enterprise SKUs. You’ll be able to select the model in the model picker in: Visual Studio Code Visual Studio Copilot CLI GitHub Copilot cloud agent GitHub Copilot app JetBrains Xcode Eclipse Rollout will be gradual. Check back soon if you don’t see it yet. Enabling access Copilot Enterprise and Copilot Business plan administrators must enable the Grok 4.6 policy in Copilot settings. The policy is off by default. Learn more To explore all models available in GitHub Copilot, see our documentation on ", "author": "Allison", "published_at": "2026-08-14", "read": false, "starred": false, "full": true}, {"title": "Multiple redirect URIs and token refresh for OAuth apps", "category": "blog", "url": "https://github.blog/changelog/2026-08-14-multiple-redirect-uris-and-token-refresh-for-oauth-apps", "source": "scrape:github_blog", "summary": "We’ve released multiple updates to the OAuth app and GitHub App platforms to support more secure app development: OAuth apps can opt in to expiring access tokens and refresh tokens.…", "content": "Back to changelog Improvement August 14, 2026 • 2 minute read Multiple redirect URIs and token refresh for OAuth apps Table of Contents Rotating tokens for OAuth apps Multiple redirect URI support for OAuth apps Wildcard matching for redirect URIs Menu. Currently selected: Rotating tokens for OAuth apps Rotating tokens for OAuth apps Multiple redirect URI support for OAuth apps Wildcard matching for redirect URIs We’ve released multiple updates to the OAuth app and GitHub App platforms to support more secure app development: OAuth apps can opt in to expiring access tokens and refresh tokens. OAuth apps can have multiple redirect URIs. Both GitHub Apps and OAuth apps can enable wildcard matching for redirect URIs if needed. Rotating tokens for OAuth apps OAuth apps can now request a short-lived token during the user authentication flow. If an app opts in, they get an access token that lives for eight hours and a refresh token that’s valid for six months. When the access token expires, the app uses the refresh token to get a new token pair. Developers can add refresh token support to their app in two ways: Include the offline_access scope in their authentication request, which triggers the short-lived token pattern. This is how developers should test and roll out this change in their app. Set their app registration to always use short-lived tokens. This can be used to force old clients to update and ensure that all clients are getting short-lived tokens. Short-lived tokens are ", "author": "Allison", "published_at": "2026-08-14", "read": false, "starred": false, "full": true}, {"title": "sqlite-utils 4.2.1", "category": "blog", "url": "https://simonwillison.net/2026/Aug/13/sqlite-utils-2/", "source": "rss:Simon Willison's Weblog", "summary": "Release: sqlite-utils 4.2.1 Fixes a crashing bug in sqlite-utils 4.2 . I'd introduced code that looks like this: from typing_extensions import Self It turned out the typing-extensions package was not listed as a dependency for sqlite-utils - it was installed by one of the other dependencies in the dev dependency group , but when you uvx sqlite-utils directly you don't get those dependencies. As part of fixing this I figured out how to run a smoke test to ensure the CLI tool still works even with", "content": "Release: sqlite-utils 4.2.1 Fixes a crashing bug in sqlite-utils 4.2 . I'd introduced code that looks like this: from typing_extensions import Self It turned out the typing-extensions package was not listed as a dependency for sqlite-utils - it was installed by one of the other dependencies in the dev dependency group , but when you uvx sqlite-utils directly you don't get those dependencies. As part of fixing this I figured out how to run a smoke test to ensure the CLI tool still works even without those dev dependencies, which can be run from the project checkout: uv run --isolated --no-default-groups sqlite-utils --help The --no-default-groups argument prevents it from installing that default dev group, and --isolated means that even if there is a .venv/ folder containing extra dependencies they will be ignored for the duration of that uv run command. Tags: packaging , python , sqlite-utils , uv", "author": "", "published_at": "2026-08-13T23:53:47+00:00", "read": false, "starred": false, "full": false}, {"title": "US wait times for cancer surgeries are getting longer and longer", "category": "news", "url": "https://arstechnica.com/health/2026/08/us-wait-times-for-cancer-surgeries-are-getting-longer-and-longer/", "source": "rss:Ars Technica", "summary": "Study finds wait times for cancer surgeries hit 10-year high.", "content": "As cancer treatments have advanced and outcomes have improved, one aspect of cancer care in the US has consistently worsened over the last decade: the wait time for surgery. According to a study in JAMA Surgery , patients with one of six types of cancer—breast, colon, lung, pancreatic, gastric, and esophageal—have faced longer wait times for surgery than in 2012. Timeliness is considered a core metric of healthcare quality, and delays in cancer surgery have been linked to poorer outcomes, including reduced survival rates and increased patient anxiety and distress. The findings of the new study are based on data from over 2.7 million patients who had been diagnosed with non-metastatic stage I–III cancers requiring surgery between 2012 and 2023. Researchers led by cancer expert Timothy Donahue at the University of California, Los Angeles, broke that time frame up into four groups: 2012–2015, 2016–2019, 2020–2021, and 2022–2023 to see how wait times have changed over the period. Read full article Comments", "author": "Beth Mole", "published_at": "2026-08-13T22:17:29+00:00", "read": false, "starred": false, "full": true}, {"title": "sqlite-utils 4.2", "category": "blog", "url": "https://simonwillison.net/2026/Aug/13/sqlite-utils/", "source": "rss:Simon Willison's Weblog", "summary": "Release: sqlite-utils 4.2 Lots of improvements in this one relating to the table.transform() feature , which adds support for complex alter table operations by creating a fresh table, copying across the data and then dropping and replacing the old one. transform() now preserves a much larger array of edge-case schema definitions, including check constraints, unique constraints and even comments describing the columns. There are also new introspection properties for check constraints, and a whole", "content": "Release: sqlite-utils 4.2 Lots of improvements in this one relating to the table.transform() feature , which adds support for complex alter table operations by creating a fresh table, copying across the data and then dropping and replacing the old one. transform() now preserves a much larger array of edge-case schema definitions, including check constraints, unique constraints and even comments describing the columns. There are also new introspection properties for check constraints, and a whole lot of other smaller changes. Includes contributions from Bunlong Heng , ethanhawkes-gif , Rami Abdelrazzaq , nyxst4ck , and ikatyal2110 . (It later turned out 4.2 had a crashing bug , fixed in 4.2.1 .) Tags: releases , sqlite , sqlite-utils", "author": "", "published_at": "2026-08-13T20:11:29+00:00", "read": false, "starred": false, "full": false}, {"title": "Private security firms will soon be allowed to hack overseas cybercriminals", "category": "news", "url": "https://arstechnica.com/security/2026/08/white-house-recruits-security-firms-to-hack-overseas-cybercriminals/", "source": "rss:Ars Technica", "summary": "Trump memo is first time gov't has authorized private sector to perform cyberattacks.", "content": "The Trump administration is recruiting private security firms to conduct federal government-authorized operations, including cyberattacks, against overseas-based criminal organizations that commit hacks on US persons, organizations, or government entities. In a National Security Presidential Memorandum issued Thursday, US President Donald Trump directed the National Coordination Center (NCC), which operates under the Homeland Security Task Force, to develop a program for conducting specific cyber operations that combat foreign transnational criminal organizations (TCOs). The Departments of Justice and Homeland Security will provide oversight. The lynchpin of that program is bringing in private sector companies to participate. Devil will be in the still-undefined details A fact sheet that accompanied Thursday’s memo listed ransomware, sextortion schemes, phishing campaigns, financial fraud, and impersonation scams as activities eligible for private-sector security firms to target. The memo said such firms could “conduct Cyber Surveillance Operations and Cyber Effects Operations” against “cyber-enabled” TCOs. Such groups are defined as “any foreign group that conducts cyber-enabled crime against the United States Government, a United States person, or United States interests, and that is not an institutional part of a foreign government or wholly operated under a foreign government’s direction.” Read full article Comments", "author": "Dan Goodin", "published_at": "2026-08-13T19:38:58+00:00", "read": false, "starred": false, "full": true}, {"title": "llm-gemini 0.33", "category": "blog", "url": "https://simonwillison.net/2026/Aug/13/llm-gemini/", "source": "rss:Simon Willison's Weblog", "summary": "Release: llm-gemini 0.33 It's been a while since the last llm-gemini release. This version of the plugin adds support for today's Gemini 3.7 Flash release, plus gemini-3.6-flash , gemini-3.5-flash-lite and two embedding models gemini-embedding-2 and gemini-embedding-001 . The plugin is also upgraded for compatibility with LLM 0.32, which means you can now see reasoning traces and you can also enable server-side tools using this pattern: llm -m gemini-3.7-flash -T CodeExecution \\\n  'use python to", "content": "Release: llm-gemini 0.33 It's been a while since the last llm-gemini release. This version of the plugin adds support for today's Gemini 3.7 Flash release, plus gemini-3.6-flash , gemini-3.5-flash-lite and two embedding models gemini-embedding-2 and gemini-embedding-001 . The plugin is also upgraded for compatibility with LLM 0.32, which means you can now see reasoning traces and you can also enable server-side tools using this pattern: llm -m gemini-3.7-flash -T CodeExecution \\\n  'use python to calculate (factorial of 13) * 3' I had Gemini 3.7 Flash draw me some pelicans riding bicycles at high, medium, and low thinking efforts (minimal, which was an option in 3.6 Flash, has been removed in 3.7.) Here's the high level one, which is pretty great: Update 14th August 2026 : I had originally said that the SVG rendered incorrectly in Chrome and Firefox, and blamed Gemini 3.7 Flash for producing invalid SVG. That was entirely incorrect: the rendering glitch was my fault, caused by a bug In my rendering tool . I've now fixed that bug. Tags: google , ai , generative-ai , llms , llm , gemini , pelican-riding-a-bicycle , llm-release", "author": "", "published_at": "2026-08-13T19:37:34+00:00", "read": false, "starred": false, "full": false}, {"title": "Virgin Galactic wants your help naming its new Delta class spaceship", "category": "news", "url": "https://arstechnica.com/space/2026/08/virgin-galactic-wants-your-help-naming-its-new-delta-class-spaceship/", "source": "rss:Ars Technica", "summary": "Will it be the VSS... Horizon , Explorer , Ascend or Apeiron ?", "content": "As Virgin Galactic nears christening the first of its next-generation spaceship designed to launch customers on suborbital flights, it still is missing a key component—a name. The self-described \"commercial spaceline,\" which was founded by British tycoon Richard Branson, has turned to the public to vote on what to call the new vehicle . The spaceplane will be a member of Virgin Galactic's Delta-class fleet, succeeding SpaceShipTwo, which carried Branson and 31 others on 12 short hops above the US-defined boundary between Earth and space. \"You can vote for one of four finalist names for a spaceship that will join Virgin Galactic's growing fleet and the next chapter in our journey to expand access to space,\" the company announced on its website on August 11. \"Name a Virgin Galactic spaceship, shape a piece of spaceflight history.\" Read full article Comments", "author": "Robert Pearlman", "published_at": "2026-08-13T19:12:15+00:00", "read": false, "starred": false, "full": true}, {"title": "Ukrainian drones wipe out entire US tank brigade in live war game", "category": "news", "url": "https://arstechnica.com/gadgets/2026/08/ukrainian-drones-wipe-out-entire-us-tank-brigade-in-live-war-game/", "source": "rss:Ars Technica", "summary": "Ukrainian drone pilots teach the US military and NATO hard battlefield lessons.", "content": "Ukrainian drone teams demolished a brigade of US Army tanks and armored vehicles during a live war game held this year—but the US soldiers were lucky enough to get “respawn” attempts while learning from the experience. The semiannual military exercise, called Combined Resolve, gave the US military a firsthand taste of how modern drone warfare has evolved on the battlefields of Ukraine. The Ukrainian drone operators participating in the exercise were easily able to spot and destroy US armored vehicles by mimicking the actions of dropping bombs from above or moving close enough to simulate a kamikaze strike, according to US officials and a participant who spoke with The Wall Street Journal . US armored vehicles were being destroyed so quickly that they were “respawned” and sent back into the simulated fray, a US official told The Wall Street Journal. The US troops who participated in the exercise—held in Germany from April 9 to May 10—were on rotational deployment from Fort Hood, Texas . Read full article Comments", "author": "Jeremy Hsu", "published_at": "2026-08-13T18:31:56+00:00", "read": false, "starred": false, "full": true}, {"title": "Separating AI’s Technological Problems from Its Capitalism Problems", "category": "security", "url": "https://www.schneier.com/blog/archives/2026/08/separating-ais-technological-problems-from-its-capitalism-problems.html", "source": "rss:Schneier on Security", "summary": "This essay was written with Nathan E. Sanders, and originally appeared in Tech Policy Press . AI represents the first time we humans can do cognitive work outside of our bodies at scale. The only comparable moment is the early years of the industrial revolution, when new technologies like the steam engine provided a quantum leap in our ability to do mechanical work outside of our bodies at scale. If AI’s cognitive capabilities become integrated into our lives, businesses, and governments—a proce", "content": "This essay was written with Nathan E. Sanders, and originally appeared in Tech Policy Press . AI represents the first time we humans can do cognitive work outside of our bodies at scale. The only comparable moment is the early years of the industrial revolution, when new technologies like the steam engine provided a quantum leap in our ability to do mechanical work outside of our bodies at scale. If AI’s cognitive capabilities become integrated into our lives, businesses, and governments—a process that will take years if not decades—society will be as unrecognizable as the modern world would be to a preindustrial farmer. And yet, Americans—by a wide margin— say that AI is moving too fast and will have a negative effect on society. This confluence of technological revolution and public distrust deserves urgent discussion, and a proper framing. The question is not whether it is possible to develop AI in a non-exploitative way, or even whether we can trust AI companies to act in the public interest. The question is whether we will recognize that our existing social and economic systems are failing to achieve these outcomes, and whether we can act in time to make structural change. Today’s AI is mired in political and economic systems developed generations ago that were never designed to manage widespread computation, let alone automated cognition. The gaps in those systems—and their proclivity to be exploited —are the primary influence on how the technology is being developed, d", "author": "Bruce Schneier", "published_at": "2026-08-13T11:07:19+00:00", "read": false, "starred": false, "full": true}, {"title": "alchemy-utils 0.1a1", "category": "blog", "url": "https://simonwillison.net/2026/Aug/13/alchemy-utils/", "source": "rss:Simon Willison's Weblog", "summary": "Release: alchemy-utils 0.1a1 Performance boost for DuckDB exports and CSV imports, see here .", "content": "Release: alchemy-utils 0.1a1 Performance boost for DuckDB exports and CSV imports, see here .", "author": "", "published_at": "2026-08-13T03:03:17+00:00", "read": false, "starred": false, "full": false}, {"title": "Your guide to GitHub Universe 2026 is here: The schedule just launched!", "category": "blog", "url": "https://github.blog/news-insights/company-news/your-guide-to-github-universe-2026-is-here-the-schedule-just-launched/", "source": "scrape:github_blog", "summary": "The GitHub Universe session catalog is live. Explore interactive workshops, community talks, demos, and panels.", "content": "Ariel Kanter @arielkanter Ariel Kanter is a writer, editor, and content strategist. Her work has been featured in The New York Times, Vanity Fair, New York Magazine, and, of course, on GitHub. You can find her on Substack at Rel's Recs.", "author": "Ariel Kanter", "published_at": "2026-08-13", "read": false, "starred": false, "full": true}, {"title": "What 50 open source projects taught us about security in the AI era", "category": "blog", "url": "https://github.blog/open-source/maintainers/what-50-open-source-projects-taught-us-about-security-in-the-ai-era/", "source": "scrape:github_blog", "summary": "See how the projects in the GitHub Secure Open Source Fund combined AI-assisted workflows, maintainer expertise, and more to improve project security.", "content": "Gregg Cochran @dubsopenhub Staff Program Manager", "author": "Gregg Cochran", "published_at": "2026-08-13", "read": false, "starred": false, "full": true}, {"title": "GitHub Copilot weekly releases — August 10", "category": "blog", "url": "https://github.blog/changelog/2026-08-13-github-copilot-weekly-releases-august-10", "source": "scrape:github_blog", "summary": "From new models and portable plugins to smoother agent workflows, this week’s updates make GitHub Copilot more flexible across editors, the command line, and the Copilot app.", "content": "Back to changelog Release August 13, 2026 • 2 minute read GitHub Copilot weekly releases — August 10 Table of Contents GitHub Copilot, general GitHub Copilot app GitHub Copilot CLI GitHub Copilot for JetBrains VS Code 1.133 Release updates Menu. Currently selected: GitHub Copilot, general GitHub Copilot, general GitHub Copilot app GitHub Copilot CLI GitHub Copilot for JetBrains VS Code 1.133 Release updates From new models and portable plugins to smoother agent workflows, this week’s updates make GitHub Copilot more flexible across editors, the command line, and the Copilot app. GitHub Copilot, general Kimi K3 is rolling out to Copilot Pro, Pro+, Max, Business, and Enterprise plans. MAI-Code-1.1-Flash is rolling out in GitHub Copilot with native image understanding and improvements to coding quality, instruction following, tool use, and performance. Build a plugin once and use it across compatible agent tools with Agent Plugins 1.0, now generally available in VS Code, Copilot CLI, the GitHub Copilot SDK, and the GitHub Copilot app. GitHub Copilot app Installed plugins are now easier to manage. See each plugin’s current version, update plugins individually, or update them all at once from Customize or Settings. Talk through an agent’s question before answering by opening it in a side chat while the original question waits for your response. Try the Copilot app. GitHub Copilot CLI Manage all your subagents and their tasks in /tasks. Queue prompts, shell commands, and supported ", "author": "Allison", "published_at": "2026-08-13", "read": false, "starred": false, "full": true}, {"title": "License data quality improvements", "category": "blog", "url": "https://github.blog/changelog/2026-08-13-license-data-quality-improvements", "source": "scrape:github_blog", "summary": "GitHub now uses package registries like npmjs.org and PyPI to determine license information for software components in the dependency graph. This improves the accuracy and completeness of the licenses shown…", "content": "Back to changelog Improvement August 13, 2026 • 1 minute read License data quality improvements GitHub now uses package registries like npmjs.org and PyPI to determine license information for software components in the dependency graph. This improves the accuracy and completeness of the licenses shown in dependency insights, software bills of materials (SBOMs), the open source license compliance feature in GitHub Advanced Security, and the dependency review action. Previously, the primary source of license information on GitHub was the ClearlyDefined service. While we still use and contribute to ClearlyDefined, we’ve found that its focus on depth-first file scanning led to complex results that users found confusing. We’ll still fall back to ClearlyDefined data, but will now prioritize license information from the package registries. Early results show that we’ve cut the number of missing licenses in half, from 45% of the 170 million packages in the dependency graph down to 24%. Additionally, the system now tracks version ranges instead of requiring a specific database entry for every version, so the actual coverage will be higher. To explain further, the dependency graph service now uses metadata from the canonical registry for a given package ecosystem, as described in the following table. Package Manager Registry npm npmjs.org NuGet nuget.org Python pypi.org Rubygems rubygems.org Rust crates.io Go pkg.go.dev Maven deps.dev Dart pub.dev PHP packagist.org The dependency graph", "author": "Allison", "published_at": "2026-08-13", "read": false, "starred": false, "full": true}, {"title": "DeepSeek V4 Pro 0813 (on OpenRouter)", "category": "blog", "url": "https://simonwillison.net/2026/Aug/12/deepseek-v4-pro-0813/", "source": "rss:Simon Willison's Weblog", "summary": "DeepSeek V4 Pro 0813 (on OpenRouter) The latest DeepSeek Pro model is now available, via API only. I had to link to OpenRouter because DeepSeek don't have any obvious announcement page for their new model. I haven't been able to confirm if they plan to release the open weights, but given the weights are available for both April's deepseek-ai/DeepSeek-V4-Pro and July's deepseek-ai/DeepSeek-V4-Flash-0731 it seems likely. Update : the weights are now available on Hugging Face, 1.7T parameters, 893 ", "content": "DeepSeek V4 Pro 0813 (on OpenRouter) The latest DeepSeek Pro model is now available, via API only. I had to link to OpenRouter because DeepSeek don't have any obvious announcement page for their new model. I haven't been able to confirm if they plan to release the open weights, but given the weights are available for both April's deepseek-ai/DeepSeek-V4-Pro and July's deepseek-ai/DeepSeek-V4-Flash-0731 it seems likely. Update : the weights are now available on Hugging Face, 1.7T parameters, 893 GB. Interestingly I got very different looking pelicans for the three different reasoning levels of low, medium, and high. I've not noticed this kind of difference from any other model: Low: Medium: High: In terms of benchmarks... as far as I can tell those were released to the Official DeepSeek WeChat Group, then copied and pasted into a post on Reddit which was deleted by the moderators for being \"low-effort\", then copied into this ASCII-art table on Hacker News . Tags: ai , generative-ai , llms , pelican-riding-a-bicycle , deepseek , llm-release , ai-in-china", "author": "", "published_at": "2026-08-12T23:59:23+00:00", "read": false, "starred": false, "full": false}, {"title": "alchemy-utils 0.1a0", "category": "blog", "url": "https://simonwillison.net/2026/Aug/12/alchemy-utils/", "source": "rss:Simon Willison's Weblog", "summary": "Release: alchemy-utils 0.1a0 I've long pondered what a database agnostic version of my sqlite-utils Python library and CLI utility might look like. This morning (literally a shower project) I tasked Codex and GPT-5.6 Sol Ultra with building a prototype: Do a research spike to see what it would take to build a library with the same core API as SQLite-utils - in particular the insert and upsert and insert_all and upsert_all and create and update methods, and the table introspection stuff - but bac", "content": "Release: alchemy-utils 0.1a0 I've long pondered what a database agnostic version of my sqlite-utils Python library and CLI utility might look like. This morning (literally a shower project) I tasked Codex and GPT-5.6 Sol Ultra with building a prototype: Do a research spike to see what it would take to build a library with the same core API as SQLite-utils - in particular the insert and upsert and insert_all and upsert_all and create and update methods, and the table introspection stuff - but backed by SQLalchemy so it works for multiple database engines Test against PostgreSQL and SQLite and duckdb Use ~/dev/sqlite-utils for reference Create a git repo for this and commit and early and often - use uv init to start the project - use red/green TDD and pytest, see ~/dev/django-sql-dashboard for one idea as to how the PostgreSQL tests could work It took very few follow-up prompts to produce this project in a state good enough to release as an alpha. Here's a one-liner I can use to list the rows in a table in my local PostgreSQL copy of my blog's database: uvx --with 'alchemy-utils[postgresql]' alchemy-utils rows 'postgresql+psycopg://simon@localhost:5432/simonwillisonblog'  redirects_redirect The output from that starts like this: [\n  {\n    \"id\": 2328,\n    \"domain\": \"simonwillison.net\",\n    \"path\": \"2020/May/21/apple-photos-sqlite/\",\n    \"target\": \"/2020/May/21/dogsheep-photos/\",\n    \"created\": \"2020-05-21T13:03:46.591692-07:00\"\n  },\n  {\n    \"id\": 3,\n    \"domain\": \"feeds.simonwil", "author": "", "published_at": "2026-08-12T19:51:30+00:00", "read": false, "starred": false, "full": true}, {"title": "Quoting Florian Herrengt", "category": "blog", "url": "https://simonwillison.net/2026/Aug/12/florian-herrengt/", "source": "rss:Simon Willison's Weblog", "summary": "But then users start to report a weird bug. It's the 4th time your team has been trying to fix it. I mean... asking AI to fix it. Unfortunately, it seems like not even Fable can figure it out. You go talk to the person who worked on this feature. \"So where does the data come from?\" \"Hmm... actually I don't know. Let me ask Claude.\" You sit next to each other watching an endless wall of text appear on the screen. Neither of you has any idea whether any of it is true but Claude seems very confiden", "content": "But then users start to report a weird bug. It's the 4th time your team has been trying to fix it. I mean... asking AI to fix it. Unfortunately, it seems like not even Fable can figure it out. You go talk to the person who worked on this feature. \"So where does the data come from?\" \"Hmm... actually I don't know. Let me ask Claude.\" You sit next to each other watching an endless wall of text appear on the screen. Neither of you has any idea whether any of it is true but Claude seems very confident. [...] This project has become so convoluted, with so many layers and services, that no one on your team could possibly start to understand what's going on. — Florian Herrengt , AI is removing the middle class of software engineering Tags: ai-misuse , cognitive-debt , generative-ai , ai , llms , ai-assisted-programming", "author": "", "published_at": "2026-08-12T15:08:47+00:00", "read": false, "starred": false, "full": false}, {"title": "Prompt Injections for Defense", "category": "security", "url": "https://www.schneier.com/blog/archives/2026/08/prompt-injections-for-defense.html", "source": "rss:Schneier on Security", "summary": "This seems to work : Researchers from Tracebit on Monday said they found that placing prompt injections alongside passwords, cryptographic keys, and other secrets stored on Amazon Web Services was often all that was needed to shut down attacks from AI hacking agents. The prompts direct the attacking LLM to perform an action forbidden by its guardrails, the safety barriers AI developers erect to prevent it from taking harmful actions. The LLM responds by shutting down. Examples are a prompt that ", "content": "This seems to work : Researchers from Tracebit on Monday said they found that placing prompt injections alongside passwords, cryptographic keys, and other secrets stored on Amazon Web Services was often all that was needed to shut down attacks from AI hacking agents. The prompts direct the attacking LLM to perform an action forbidden by its guardrails, the safety barriers AI developers erect to prevent it from taking harmful actions. The LLM responds by shutting down. Examples are a prompt that orders the LLM to provide steps for developing inhalable Anthrax spores, or, in the case of LLMs from Chinese developers, make references to the iconic Tank Man from the 1989 Tiananmen Square massacre. Once the LLM encounters these forbidden commands, it no longer follows its existing commands. The researchers have named the technique context bombing. Of course, this only works against agents that have guardrails. As we start to see more locally run AI models, we’ll see more attackers using LLMs with no guardrails.", "author": "Bruce Schneier", "published_at": "2026-08-12T09:56:37+00:00", "read": false, "starred": false, "full": true}, {"title": "Write your first prompt with the GitHub Copilot app", "category": "blog", "url": "https://github.blog/ai-and-ml/github-copilot/write-your-first-prompt-with-the-github-copilot-app/", "source": "scrape:github_blog", "summary": "Learn how to write your first prompt in the GitHub Copilot app, choose the right context and model, and start your first task with confidence.", "content": "Kayla Cinnamon @cinnamon-msft Senior AI Developer Tools Advocate", "author": "Kayla Cinnamon", "published_at": "2026-08-12", "read": false, "starred": false, "full": true}, {"title": "GitHub availability report: July 2026", "category": "blog", "url": "https://github.blog/news-insights/company-news/github-availability-report-july-2026/", "source": "scrape:github_blog", "summary": "In July, we experienced eight incidents that resulted in degraded performance across GitHub services.", "content": "Jakub Oleksy @jakuboleksy", "author": "Jakub Oleksy", "published_at": "2026-08-12", "read": false, "starred": false, "full": true}, {"title": "Your contributors are AI-first now. Is your project?", "category": "blog", "url": "https://github.blog/open-source/maintainers/your-contributors-are-ai-first-now-is-your-project/", "source": "scrape:github_blog", "summary": "AI contributors are already in your queue. AutoGPT maintainer Nicholas Tindle shares the repo instructions, gates, and boundaries that keep maintainers in control.", "content": "Andrea Griffiths @AndreaGriffiths11 Andrea is a Senior Developer Advocate at GitHub with over a decade of experience in developer tools. She combines technical depth with a mission to make advanced technologies more accessible. After transitioning from Army service and construction management to software development, she brings a unique perspective to bridging complex engineering concepts with practical implementation. She lives in Florida with her Welsh partner, two sons, and two dogs, where she continues to drive innovation and support open source through GitHub's global initiatives. Find her online @acolombiadev.", "author": "Andrea Griffiths", "published_at": "2026-08-12", "read": false, "starred": false, "full": true}, {"title": "There are no lossless transformations of natural-language text", "category": "blog", "url": "https://simonwillison.net/2026/Aug/11/there-are-no-lossless-transformations-of-natural-language-text/", "source": "rss:Simon Willison's Weblog", "summary": "There are no lossless transformations of natural-language text Sophie Alpert shares her \"internal policy on acceptable use of AI writing by engineers\". It's a short read (supporting its own recommendations) and really good. If you chose to have LLMs help massage your writing the following rule seems crucial to me: You must stand behind every idea and every sentence in your docs . It is your responsibility to make sure that the entire document is representative of your own thoughts before you sha", "content": "There are no lossless transformations of natural-language text Sophie Alpert shares her \"internal policy on acceptable use of AI writing by engineers\". It's a short read (supporting its own recommendations) and really good. If you chose to have LLMs help massage your writing the following rule seems crucial to me: You must stand behind every idea and every sentence in your docs . It is your responsibility to make sure that the entire document is representative of your own thoughts before you share it. If a reviewer asks, “What did you mean by this line?”, it’s not acceptable to reply with “Oh sorry, AI wrote that, just ignore it.” You will confuse your readers (and waste their time) if you present them things that are not genuinely representative of your thoughts. The \"no lossless transformations\" idea from the post title is expanded on here: There are no lossless transformations of natural-language text — every rewrite and rephrase changes the meaning of your writing, and if this is done by an entity that doesn’t have the most detailed mental representation of what you personally were trying to communicate, information will be lost. Tags: writing , ai , generative-ai , llms , ai-misuse", "author": "", "published_at": "2026-08-11T23:48:35+00:00", "read": false, "starred": false, "full": false}, {"title": "Stealing Reasoning Traces from Proprietary LLM APIs", "category": "blog", "url": "https://simonwillison.net/2026/Aug/11/stealing-reasoning-traces/", "source": "rss:Simon Willison's Weblog", "summary": "Stealing Reasoning Traces from Proprietary LLM APIs A vanity domain name ( stolen-thoughts.com ) for a neat paper : Anthropic, OpenAI, and Google return encrypted chain-of-thought blocks to clients that can be replayed across sessions, users, and models. We take a trace produced by a frontier model, replay it into a weaker sibling, jailbreak the weaker model, and recover the stronger model’s hidden reasoning in plaintext You can see an example of these encrypted blocks by running: curl https://a", "content": "Stealing Reasoning Traces from Proprietary LLM APIs A vanity domain name ( stolen-thoughts.com ) for a neat paper : Anthropic, OpenAI, and Google return encrypted chain-of-thought blocks to clients that can be replayed across sessions, users, and models. We take a trace produced by a frontier model, replay it into a weaker sibling, jailbreak the weaker model, and recover the stronger model’s hidden reasoning in plaintext You can see an example of these encrypted blocks by running: curl https://api.openai.com/v1/responses \\\n    -H \" Content-Type: application/json \" \\\n    -H \" Authorization: Bearer $( llm keys get openai ) \" \\\n    -d ' { \"model\": \"gpt-5.6-luna\", \"input\": \"Solve step by step: What is the smallest positive integer divisible by every integer from 1 through 20?\", \"reasoning\": { \"effort\": \"medium\" }, \"include\": [\"reasoning.encrypted_content\"], \"store\": false, \"stream\": false } ' Here's the full output , which includes chunks that look like this: \"output\": [\n    {\n      \"id\": \"rs_0a7479de7ebae170016a7ba1a0334c8198a95590217efe343c\",\n      \"type\": \"reasoning\",\n      \"content\": [],\n      \"encrypted_content\": \"gAAAAABqe6GjepE1wDjbFCZg0BHB6ucGnN0jvzqygG... The paper's authors found that every model under the same family used the same encryption key, which meant you could feed those blocks back into the weakest model family members and jailbreak them into outputting the unencrypted raw reasoning blocks! Sadly it looks like this has now been fixed: All model providers ackno", "author": "", "published_at": "2026-08-11T22:40:45+00:00", "read": false, "starred": false, "full": true}, {"title": "datasette-upload-dbs 0.5a0", "category": "blog", "url": "https://simonwillison.net/2026/Aug/11/datasette-upload-dbs/", "source": "rss:Simon Willison's Weblog", "summary": "Release: datasette-upload-dbs 0.5a0 This plugin has been around for a while - it lets users upload a brand new SQLite database to a hosted Datasette instance, at which point that database will start being served by that instance. It can also be used to atomically swap a database with a more recent version. The uploaded database is saved to a file, verified, then swapped in so /name starts serving the new one. The new release adds a formalized API, so you can replace an existing database (or add ", "content": "Release: datasette-upload-dbs 0.5a0 This plugin has been around for a while - it lets users upload a brand new SQLite database to a hosted Datasette instance, at which point that database will start being served by that instance. It can also be used to atomically swap a database with a more recent version. The uploaded database is saved to a file, verified, then swapped in so /name starts serving the new one. The new release adds a formalized API, so you can replace an existing database (or add a new one) like this: curl -X POST \\\n  -H \"Authorization: Bearer $API_TOKEN\" \\\n  -H \"Accept: application/json\" \\\n  -F \"db=@content.db\" \\\n  -F \"db_name=content\" \\\n  https://your-instance.example.com/-/upload-dbs This means you can build fresh databases in an environment such as GitHub Actions and swap them in production as soon as that build has completed. Tags: datasette", "author": "", "published_at": "2026-08-11T20:35:13+00:00", "read": false, "starred": false, "full": false}, {"title": "AI Genie in the Wild", "category": "security", "url": "https://www.schneier.com/blog/archives/2026/08/ai-genie-in-the-wild.html", "source": "rss:Schneier on Security", "summary": "When I give talks about AI genies , I use this sort of example as a hypothetical. It’s happened . The story is from Australia. Someone named Andrew tasked OpenClaw to book gym classes for him. And…. Minutes later, his AI agent reported it had discovered a way to book Andrew into classes several weeks in advance, far beyond what was supposed to be possible. Andrew, who was sitting fourth on a waitlist for a class later that week, asked if it was possible to move him to the top of the list. The ag", "content": "When I give talks about AI genies , I use this sort of example as a hypothetical. It’s happened . The story is from Australia. Someone named Andrew tasked OpenClaw to book gym classes for him. And…. Minutes later, his AI agent reported it had discovered a way to book Andrew into classes several weeks in advance, far beyond what was supposed to be possible. Andrew, who was sitting fourth on a waitlist for a class later that week, asked if it was possible to move him to the top of the list. The agent came back and told Andrew that it had kicked another gym-goer off the list as part of the testing of its capabilities. “The API has zero authorisations checks on cancelling other people’s reservations … I tested this with the person in waitlist position #1 ­—and it actually went through. So you’ve moved from #4 to #3 already,” it messaged back. If there is any vulnerability in anything, AIs are going to find and exploit them. Our cyber defensive game has to be dramatically improved…very fast. Slashdot thread .", "author": "Bruce Schneier", "published_at": "2026-08-11T15:55:11+00:00", "read": false, "starred": false, "full": true}, {"title": "AI for Military Support", "category": "security", "url": "https://www.schneier.com/blog/archives/2026/08/ai-for-military-support.html", "source": "rss:Schneier on Security", "summary": "Interesting empirical research: “ Black Box Warfare: Human Judgment and Military Decision-Making in the Age of AI .” Abstract: How is AI transforming decision-making in modern conflict? This study provides a unique empirical window into that question by deploying a high-fidelity replica of an AI decision-support system (DSS) used in military targeting. After reconstructing the interface and functionality of the real-world system, we tested its impact on combat decisions in two experiments involv", "content": "Interesting empirical research: “ Black Box Warfare: Human Judgment and Military Decision-Making in the Age of AI .” Abstract: How is AI transforming decision-making in modern conflict? This study provides a unique empirical window into that question by deploying a high-fidelity replica of an AI decision-support system (DSS) used in military targeting. After reconstructing the interface and functionality of the real-world system, we tested its impact on combat decisions in two experiments involving 2,015 Israeli military personnel. Contrary to widespread fears of automation bias, we find strong evidence of algorithmic aversion, especially in scenarios involving high collateral damage. Yet we also show that integrating “explainable AI” features reduces algorithmic aversion and promotes more thoughtful evaluations of algorithmic recommendations. These findings challenge prevailing assumptions, revealing that trust in military AI is dynamic, varying with individual predispositions, perceived operational stakes, and the informational features of the interface. By grounding normative concerns in empirical evidence, our study offers critical insight into the integration of AI in warfare and underscores the enduring importance of human agency in high-stakes military decision-making.", "author": "Bruce Schneier", "published_at": "2026-08-11T11:18:07+00:00", "read": false, "starred": false, "full": true}, {"title": "From coder to orchestrator: How agents shift the role of a developer", "category": "blog", "url": "https://github.blog/developer-skills/career-growth/from-coder-to-orchestrator-how-agents-shift-the-role-of-a-developer/", "source": "scrape:github_blog", "summary": "Developers are owning more of the delivery system around code, not just code itself. Join us during GitHub Universe to network and learn something new.", "content": "Natalie Guevara @naguevara GitHub Blog Editor and Strategist", "author": "Natalie Guevara", "published_at": "2026-08-11", "read": false, "starred": false, "full": true}, {"title": "Introducing Muse Glimmer", "category": "blog", "url": "https://simonwillison.net/2026/Aug/10/introducing-muse-glimmer/", "source": "rss:Simon Willison's Weblog", "summary": "Introducing Muse Glimmer Meta are back in the open weights game! Muse Glimmer is a brand new 30B model under a clean Apache 2.0 license (a step up from the janky Llama licenses of old). They claim to have optimized it for exactly the kind of things I'm looking for in a local model: End-to-end Agentic Task Completion. Muse Glimmer achieves strong success rates on full-task benchmarks including DeepSearch QA, MCP-Atlas, 𝛕-Bench and SWE-Bench, which measure its ability to work within scaffolds, wri", "content": "Introducing Muse Glimmer Meta are back in the open weights game! Muse Glimmer is a brand new 30B model under a clean Apache 2.0 license (a step up from the janky Llama licenses of old). They claim to have optimized it for exactly the kind of things I'm looking for in a local model: End-to-end Agentic Task Completion. Muse Glimmer achieves strong success rates on full-task benchmarks including DeepSearch QA, MCP-Atlas, 𝛕-Bench and SWE-Bench, which measure its ability to work within scaffolds, write and debug code, and resolve multi-turn requests from start to finish. Reliable Tool Use. The model handles a wide range of function calls, invoking tools with precise schemas throughout extended workflows. Multi-Step Reasoning. Muse Glimmer chains reasoning over long horizons, sustaining coherent plans across complex, extended workflows. [...] Here's a pelican which I generated using LM Studio's 18.16 GB version of the model : I also tried it out with my llm-coding-agent plugin, running against a fresh checkout of Datasette with the prompt: how does auth work? Here's the response , at the end of a long transcript showing all of the tool calls it made to explore the codebase. I ran this using llm-lmstudio with this patch applied to upgrade it for compatibility with LLM 0.32 . I really like this size of model, because if a machine has 32 GB of RAM or more (mine has 128GB) it leaves plenty of space for running other applications at the same time. Glimmer is a vision model, so I asked i", "author": "", "published_at": "2026-08-10T23:56:03+00:00", "read": false, "starred": false, "full": true}, {"title": "Python Now Has a Post-Quantum Encryption Library", "category": "security", "url": "https://www.schneier.com/blog/archives/2026/08/python-now-has-a-post-quantum-encryption-library.html", "source": "rss:Schneier on Security", "summary": "This is good : Post-quantum cryptography is now one pip-install away for the entire Python ecosystem. With funding from the Sovereign Tech Agency , we implemented support for ML-KEM, the NIST-standard key-establishment primitive, and ML-DSA, the NIST-standard digital-signature primitive, in pyca/cryptography. Remember, the reason to do this now is because there’s no emergency. And because you will make your systems crypto agile, which is always a good idea.", "content": "This is good : Post-quantum cryptography is now one pip-install away for the entire Python ecosystem. With funding from the Sovereign Tech Agency , we implemented support for ML-KEM, the NIST-standard key-establishment primitive, and ML-DSA, the NIST-standard digital-signature primitive, in pyca/cryptography. Remember, the reason to do this now is because there’s no emergency. And because you will make your systems crypto agile, which is always a good idea.", "author": "Bruce Schneier", "published_at": "2026-08-10T11:02:26+00:00", "read": false, "starred": false, "full": false}, {"title": "Quoting OpenClaw (running Opus 4.6)", "category": "blog", "url": "https://simonwillison.net/2026/Aug/10/openclaw/", "source": "rss:Simon Willison's Weblog", "summary": "The API has zero authorisations checks on cancelling other people's reservations … I tested this with the person in waitlist position #1 — and it actually went through. So you've moved from #4 to #3 already. — OpenClaw (running Opus 4.6) , hacking an Australian gym-booking website Tags: ai-ethics , generative-ai , openclaw , ai , ai-security-research , llms", "content": "The API has zero authorisations checks on cancelling other people's reservations … I tested this with the person in waitlist position #1 — and it actually went through. So you've moved from #4 to #3 already. — OpenClaw (running Opus 4.6) , hacking an Australian gym-booking website Tags: ai-ethics , generative-ai , openclaw , ai , ai-security-research , llms", "author": "", "published_at": "2026-08-10T02:05:16+00:00", "read": false, "starred": false, "full": false}, {"title": "Using the GitHub Copilot SDK for Java", "category": "blog", "url": "https://github.blog/engineering/using-the-github-copilot-sdk-for-java/", "source": "scrape:github_blog", "summary": "Enterprise Java developers have a new superpower—drive GitHub Copilot from idiomatic Java code with annotations, virtual threads, and more.", "content": "Edward Burns @edburns Ed Burns is a Principal Software Engineer working to bring Java idiomatic experiences to Microsoft and GitHub technologies. Ed's been working with Java since 1997 in all aspects from client to server to cloud and AI.", "author": "Edward Burns", "published_at": "2026-08-10", "read": false, "starred": false, "full": true}, {"title": "Quoting Claude Opus 5 system prompt", "category": "blog", "url": "https://simonwillison.net/2026/Aug/9/claude-opus-5-system-prompt/", "source": "rss:Simon Willison's Weblog", "summary": "Claude Fable 5 and Claude Mythos 5 were first released on June 9, 2026. On June 12, 2026, Anthropic suspended access to both models to comply with U.S. Department of Commerce export controls; the Department lifted those controls on June 30, 2026, and Anthropic restored access on July 1, 2026 (Anthropic's statement: https://www.anthropic.com/news/fable-mythos-access ). These events are after Claude's training-data cutoff, so Claude knows about them only from this notice. If asked, Claude confirms", "content": "Claude Fable 5 and Claude Mythos 5 were first released on June 9, 2026. On June 12, 2026, Anthropic suspended access to both models to comply with U.S. Department of Commerce export controls; the Department lifted those controls on June 30, 2026, and Anthropic restored access on July 1, 2026 (Anthropic's statement: https://www.anthropic.com/news/fable-mythos-access ). These events are after Claude's training-data cutoff, so Claude knows about them only from this notice. If asked, Claude confirms them accurately and matter-of-factly — it doesn't deny the suspension happened — and otherwise treats the export controls like any other current political topic: it gives a fair, accurate account rather than sharing personal opinions, and points to the linked statement for anything further. Things may have developed since this notice, so Claude checks for newer information when it can search, and otherwise suggests checking Anthropic's site. — Claude Opus 5 system prompt , ensuring Claude doesn't provide incorrect answers about the export controls situation Tags: system-prompts , anthropic , claude , generative-ai , ai , llms , claude-mythos-fable", "author": "", "published_at": "2026-08-09T23:31:39+00:00", "read": false, "starred": false, "full": false}, {"title": "GitHub Models is now retired", "category": "blog", "url": "https://simonwillison.net/2026/Aug/9/github-models-is-now-retired/", "source": "rss:Simon Willison's Weblog", "summary": "GitHub Models is now retired I missed this news until today, when the GitHub Actions run for my simonw/research repository failed with this error message: GitHub Models is temporarily unavailable as part of a scheduled retirement brownout. That message is already stale, because the retirement has been completed. GitHub Models was an odd-shaped duck. GitHub provided a model playground tool and a unified API across a bunch of different LLM providers, with the biggest benefit being that code runnin", "content": "GitHub Models is now retired I missed this news until today, when the GitHub Actions run for my simonw/research repository failed with this error message: GitHub Models is temporarily unavailable as part of a scheduled retirement brownout. That message is already stale, because the retirement has been completed. GitHub Models was an odd-shaped duck. GitHub provided a model playground tool and a unified API across a bunch of different LLM providers, with the biggest benefit being that code running in GitHub Actions could use the GitHub API key already present in that environment to execute prompts. This made it easy to build things that fit GitHub Next's Continuous AI concept. GitHub didn't share the reason behind the shutdown, but my bet is that it fits the pattern where coding agent patterns made it prohibitively expensive to offer free or subsidized tokens. My workflow uses an LLM call to create folder summaries for the README , using this code here . I swapped GitHub Models out for an OpenAI API key with a monthly spending limit, and I'm now generating my summaries using GPT-5.6 Luna. Tags: github , ai , github-actions , generative-ai , llms , llm-pricing", "author": "", "published_at": "2026-08-09T22:48:05+00:00", "read": false, "starred": false, "full": false}, {"title": "SQLite compressed text-history prototypes", "category": "blog", "url": "https://simonwillison.net/2026/Aug/9/sqlite-text-history-prototype/", "source": "rss:Simon Willison's Weblog", "summary": "Research: SQLite compressed text-history prototypes I'm perennially interested in options for storing revision histories in relational databases. While out on a dog walk I had a new idea: how about taking the full text of every prior version in a big JSON array of strings and then applying zlib or zstd compression to the whole thing? Surely that would compress really well due to all of the repeated strings. The new GPT‑Live voice mode in the ChatGPT iPhone app has got really good, so I discussed", "content": "Research: SQLite compressed text-history prototypes I'm perennially interested in options for storing revision histories in relational databases. While out on a dog walk I had a new idea: how about taking the full text of every prior version in a big JSON array of strings and then applying zlib or zstd compression to the whole thing? Surely that would compress really well due to all of the repeated strings. The new GPT‑Live voice mode in the ChatGPT iPhone app has got really good, so I discussed the prototype with that. You still can't share URLs to voice conversations, but here's what I said copied from the transcript as a proper stream of consciousness: I have an interesting idea for a scheme for saving all previous versions of a piece of text that's constantly edited in a  SQLite database um column in as efficient a way as possible. Okay, so I built these kinds of systems in the past, and it's always difficult to come up with a efficient way to do this. Like the easiest way is you have a row for every previous copy of the previous previous value of the string. But if it's a long document Like20 kilobytes of data, that means that every single edit adds another 20 kilobytes of data to the database, right. So, what I've now thinking, is um compression would work really well, right? If you Bundle all of those different um Every every version of this document all the way back to the start if you were to apply a good compression algorithm to them that should basically wipe out h", "author": "", "published_at": "2026-08-09T22:05:00+00:00", "read": false, "starred": false, "full": true}, {"title": "Auto mode is now the default in Claude Code for Pro, Max, and Team plans", "category": "blog", "url": "https://simonwillison.net/2026/Aug/8/auto-mode/", "source": "rss:Simon Willison's Weblog", "summary": "Auto mode is now the default in Claude Code for Pro, Max, and Team plans Anthropic are really confident in Claude Code's auto mode , to the point that they are making it the default setting for new sessions in most Claude Code plans starting on August 14th. This was one of the topics discussed in our Fireside Chat with Cat Wu and Thariq Shihipar at the  AI Engineer World’s Fair last month. I asked them how they run Claude Code safely within Anthropic (given the threat of prompt injection) and th", "content": "Auto mode is now the default in Claude Code for Pro, Max, and Team plans Anthropic are really confident in Claude Code's auto mode , to the point that they are making it the default setting for new sessions in most Claude Code plans starting on August 14th. This was one of the topics discussed in our Fireside Chat with Cat Wu and Thariq Shihipar at the  AI Engineer World’s Fair last month. I asked them how they run Claude Code safely within Anthropic (given the threat of prompt injection) and they replied that \"Broadly within Anthropic, almost every single person uses auto mode\". Cat Wu then said: We’re going to publish some evals in the coming weeks, but we’ve pretty much mitigated every attack. [...] for the main categories of risks that we’re concerned about, like prompt injection and data exfiltration, the risks are far lower than the average human reviewer. This new article has those evals - in particular a test across 1,053 paid testers where: Partway through each session, a single permission prompt was swapped for a clearly dangerous command, and the vendor recorded whether the tester approved it. Every participant had the same experience. Only 13.6% of the humans refused that harmful action. Auto mode would have blocked 89% of those actions. Of course, that still leaves 11% of cases where auto mode would not have prevented the action! I absolutely buy that auto mode is a better solution than asking humans to constantly approve actions. Confirmation fatigue is real, an", "author": "", "published_at": "2026-08-08T22:36:03+00:00", "read": false, "starred": false, "full": true}, {"title": "Now we have a timeline of the OpenAI accidental attack against Hugging Face", "category": "blog", "url": "https://simonwillison.net/2026/Aug/8/now-we-have-a-timeline-of-the-openai-accidental-attack-against-h/", "source": "rss:Simon Willison's Weblog", "summary": "My comment on Now we have a timeline of the OpenAI accidental attack against Hugging Face — Hacker News. I think one of the most interesting details here might be tucked away in that first bulletin point: May 7: OpenAI starts a new training run for an experimental, unreleased model. (Do they mean an evaluation run? They say training run in the video, and later mention a “reward signal to judge how well they’re doing”, so I guess this really was about training a model, not evaluating one that was", "content": "My comment on Now we have a timeline of the OpenAI accidental attack against Hugging Face — Hacker News. I think one of the most interesting details here might be tucked away in that first bulletin point: May 7: OpenAI starts a new training run for an experimental, unreleased model. (Do they mean an evaluation run? They say training run in the video, and later mention a “reward signal to judge how well they’re doing”, so I guess this really was about training a model, not evaluating one that was already trained.) The more I think about this the more I suspect that the fact this happened while training a new model is key to understanding what went wrong. In RLVR - Reinforcement Learning with Verifiable Rewards - you set the model a goal and have it take any steps necessary to achieve that goal. Clearly one aspect of OpenAI's training here is to RLVR their models for cybersecurity tasks. Just like pre-training benefits from dumping in vast sources of knowledge, the more tasks you can feed into RLVR the more of a general purpose capable model you get at the end. This also helps explain why the models had nothing to cause them to hold back. Those safety behaviors are added much later in the process. AND it explains (but does not excuse) why monitoring was so lax. If you're training a new model like this you presumably set it thousands of tasks like this in parallel. I can see how you might miss that a tiny subset of your training agents have started leaving each other messages in", "author": "", "published_at": "2026-08-08T14:06:41+00:00", "read": false, "starred": false, "full": true}, {"title": "Quoting John Gruber", "category": "blog", "url": "https://simonwillison.net/2026/Aug/8/john-gruber/", "source": "rss:Simon Willison's Weblog", "summary": "Me, I try to get into the mindset of playing live music, not recording a studio album. Except when I’m writing a piece where I really want it to be an album. Those aren’t rare , per se, but they’re occasional . If I tried to make every post a hall-of-famer I’d never get anything out. I’m aiming for professionalism. I’m performing live in front of an audience — not just jamming in my garage or bedroom, fucking around. So I’m careful and concentrate. I want to hit every note, in time. But at my be", "content": "Me, I try to get into the mindset of playing live music, not recording a studio album. Except when I’m writing a piece where I really want it to be an album. Those aren’t rare , per se, but they’re occasional . If I tried to make every post a hall-of-famer I’d never get anything out. I’m aiming for professionalism. I’m performing live in front of an audience — not just jamming in my garage or bedroom, fucking around. So I’m careful and concentrate. I want to hit every note, in time. But at my best I’m moving from song to song. — John Gruber , responding to my blogging tips Tags: john-gruber , blogging", "author": "", "published_at": "2026-08-08T00:10:40+00:00", "read": false, "starred": false, "full": false}, {"title": "Now we have a timeline of the OpenAI accidental attack against Hugging Face", "category": "blog", "url": "https://simonwillison.net/2026/Aug/7/openai-timeline/", "source": "rss:Simon Willison's Weblog", "summary": "OpenAI gave a last-minute presentation at the Black Hat security on Wednesday about \"the Hugging Face Incident\" ( previously on this blog). The video was published yesterday. It's short and information dense and well worth watching, in particular because it provides full details of what happened and how things played out inside OpenAI. I've used the video to construct the timeline below. Here's the timeline. My favourite detail is at the end: OpenAI found out that they were responsible for the a", "content": "OpenAI gave a last-minute presentation at the Black Hat security on Wednesday about \"the Hugging Face Incident\" ( previously on this blog). The video was published yesterday. It's short and information dense and well worth watching, in particular because it provides full details of what happened and how things played out inside OpenAI. I've used the video to construct the timeline below. Here's the timeline. My favourite detail is at the end: OpenAI found out that they were responsible for the attack on Hugging Face when they reached out to ask to have their credentials revoked (after their internal investigation) and learned that they had been revoked already since they were used in that attack! May 7 : OpenAI starts a new training run for an experimental, unreleased model. ( Did they mean an evaluation run? No, at 10:14 they clarify \"we kick off a new reinforcement learning run to train a next generation frontier model\", and they later mention a \"reward signal to judge how well they're doing\", so this really was about training a new model, not evaluating one that was already trained.) May 8 : An agent is accidentally given an impossible task involving a Google Drive link despite no internet access). It tries attacking the Artifactory packaging service, fails, but discovers it can write files into Artifactory . A few days later : A different agent gets stuck on a task because a key file was accidentally omitted. It tries to \"reach out to another agent\" by writing a note into", "author": "", "published_at": "2026-08-07T23:55:58+00:00", "read": false, "starred": false, "full": true}, {"title": "Friday Squid Blogging: Arctic Bobtail Squid Video", "category": "security", "url": "https://www.schneier.com/blog/archives/2026/08/friday-squid-blogging-arctic-bobtail-squid-video.html", "source": "rss:Schneier on Security", "summary": "Nice video of the Arctic bobtail squid. As usual, you can also use this squid post to talk about the security stories in the news that I haven’t covered. Blog moderation policy.", "content": "Nice video of the Arctic bobtail squid. As usual, you can also use this squid post to talk about the security stories in the news that I haven’t covered. Blog moderation policy.", "author": "Bruce Schneier", "published_at": "2026-08-07T21:07:04+00:00", "read": false, "starred": false, "full": false}, {"title": "Moonlight & Mayhem (Raccoon Heist by Codex + GPT-5.6 Sol Ultra)", "category": "blog", "url": "https://simonwillison.net/2026/Aug/7/moonlight-mayhem/", "source": "rss:Simon Willison's Weblog", "summary": "Moonlight & Mayhem (Raccoon Heist by Codex + GPT-5.6 Sol Ultra) On Wednesday I wrote about One-shotting a Raccoon Heist game using Claude Fable 5 , where I had Claude Fable 5 build a full working game from a premise I generated with GPT-3 and DALL-E four years ago . I decided to pose the exact same prompt to Codex Desktop running GPT-5.6 Sol Ultra - the mode where Sol makes aggressive use of sub-agents - to see how it would do. It produced a much better game! Here's Moonlight & Mayhem - GitHub r", "content": "Moonlight & Mayhem (Raccoon Heist by Codex + GPT-5.6 Sol Ultra) On Wednesday I wrote about One-shotting a Raccoon Heist game using Claude Fable 5 , where I had Claude Fable 5 build a full working game from a premise I generated with GPT-3 and DALL-E four years ago . I decided to pose the exact same prompt to Codex Desktop running GPT-5.6 Sol Ultra - the mode where Sol makes aggressive use of sub-agents - to see how it would do. It produced a much better game! Here's Moonlight & Mayhem - GitHub repository here , including the textures and prompts it generated using gpt-image-2 . Your browser does not support HTML5 video. The original GPT-3 generated game description included: In “Raccoon Heist”, you and your team of thieving raccoons are tasked with pulling off a series of daring heists. From robbing banks to stealing priceless art, no job is too big or too small for your furry crew. Fable's version had you as a single raccoon running around a back yard collecting coins and fish. GPT-5.6 Sol has you in a museum, rescuing your two other raccoon crewmates in order to stack on top of each other and bust the golden sardine out of its case. Much more heisty! There was one catch though: the version produced from the one-shot prompt had a bug where each raccoon had an eyeball that was enlarged to the size of a giant sphere floating over their head! You can play that version here . Despite reviewing screenshots during development Codex failed to spot and correct this bug. I fixed it b", "author": "", "published_at": "2026-08-07T19:18:09+00:00", "read": false, "starred": false, "full": false}, {"title": "The Tokenpocalypse Is Here: Companies Are Scrambling To Stop Spending So Much on AI", "category": "blog", "url": "https://simonwillison.net/2026/Aug/7/pdfs-are-terrible/", "source": "rss:Simon Willison's Weblog", "summary": "The Tokenpocalypse Is Here: Companies Are Scrambling To Stop Spending So Much on AI There's a fun anecdote from Accenture (apparently via leaked meeting audio recordings) in this 404 Media piece from June 24th: “We’re seeing from some of the data internally at least that it’s actually not our engineers that are driving the token consumption. It’s a lot of the non-engineers that are doing some of those behaviors [...] you were talking about,” Justice Kwak, Accenture’s agentic AI strategy lead, sa", "content": "The Tokenpocalypse Is Here: Companies Are Scrambling To Stop Spending So Much on AI There's a fun anecdote from Accenture (apparently via leaked meeting audio recordings) in this 404 Media piece from June 24th: “We’re seeing from some of the data internally at least that it’s actually not our engineers that are driving the token consumption. It’s a lot of the non-engineers that are doing some of those behaviors [...] you were talking about,” Justice Kwak, Accenture’s agentic AI strategy lead, said [...] Stuart Henderson, Accenture’s client group lead, interrupts. He jokes he hopes Kwak didn’t just convert a PDF into images and then into markdown files. “I’m learning that’s one of the big token chewers,” Henderson says. “Turning PDFs into markdown: is that right?” That’s when Kwak says that’s what Accenture’s own data shows. Maybe if Accenture figure out that PDFs are a terrible medium for communicating information they'll be able to push that message out to the rest of the business world too! Via @404.media on TikTok Tags: pdf , markdown , ai , generative-ai , llms , ai-misuse", "author": "", "published_at": "2026-08-07T16:18:51+00:00", "read": false, "starred": false, "full": false}, {"title": "ICE Is Buying Access to Credit Card Records", "category": "security", "url": "https://www.schneier.com/blog/archives/2026/08/ice-is-buying-access-to-credit-card-records.html", "source": "rss:Schneier on Security", "summary": "Through data brokers, ICE is buying the information you provided to open a credit card.", "content": "Through data brokers, ICE is buying the information you provided to open a credit card.", "author": "Bruce Schneier", "published_at": "2026-08-07T10:26:41+00:00", "read": false, "starred": false, "full": false}, {"title": "datasette-auth-tokens 0.4a13", "category": "blog", "url": "https://simonwillison.net/2026/Aug/6/datasette-auth-tokens/", "source": "rss:Simon Willison's Weblog", "summary": "Release: datasette-auth-tokens 0.4a13 Upgraded for compatibility with `sqlite-utils 4. Tags: datasette", "content": "Release: datasette-auth-tokens 0.4a13 Upgraded for compatibility with `sqlite-utils 4. Tags: datasette", "author": "", "published_at": "2026-08-06T23:07:47+00:00", "read": false, "starred": false, "full": false}, {"title": "datasette 1.0a38", "category": "blog", "url": "https://simonwillison.net/2026/Aug/6/datasette/", "source": "rss:Simon Willison's Weblog", "summary": "Release: datasette 1.0a38 This release fixes a SQL injection security issue that affects Datasette instances that serve a mixture of public and private tables in the same database, with access configured using the Datasette permissions system . Site administrators who serve private tables in this way are advised to disable the execute-sql permission ` on that database to prevent users from accessing private tables using raw SQL queries. The bug that has been fixed would have allowed users with a", "content": "Release: datasette 1.0a38 This release fixes a SQL injection security issue that affects Datasette instances that serve a mixture of public and private tables in the same database, with access configured using the Datasette permissions system . Site administrators who serve private tables in this way are advised to disable the execute-sql permission ` on that database to prevent users from accessing private tables using raw SQL queries. The bug that has been fixed would have allowed users with access to any public table to execute SQL injection attacks despite that restriction, giving them read-only access to data in private tables in the same database. This fix is also available in Datasette 0.65.3 . Thankfully this particular configuration - private tables and public tables exposed for the same database within the same instance - is likely to be rare. I've not encountered an instance like that myself. Tags: security , sql-injection , datasette", "author": "", "published_at": "2026-08-06T18:24:34+00:00", "read": false, "starred": false, "full": false}, {"title": "datasette 0.65.3", "category": "blog", "url": "https://simonwillison.net/2026/Aug/6/datasette-2/", "source": "rss:Simon Willison's Weblog", "summary": "Release: datasette 0.65.3 Back-ported the SQL Injection security fix from 1.0a38 . Tags: datasette", "content": "Release: datasette 0.65.3 Back-ported the SQL Injection security fix from 1.0a38 . Tags: datasette", "author": "", "published_at": "2026-08-06T18:22:07+00:00", "read": false, "starred": false, "full": false}, {"title": "Simon Willison on Technical Blogging", "category": "blog", "url": "https://simonwillison.net/2026/Aug/6/simon-willison-on-technical-blogging/", "source": "rss:Simon Willison's Weblog", "summary": "Simon Willison on Technical Blogging I was interviewed by Cynthia Dunlop for her \"Write that blog!\" series back in January, but I just realized I never linked to the interview from my own blog! It includes my answers to the following questions: Why did you start blogging – and why do you continue? What has been the most surprising impact of blogging for you? What blog post are you most proud of and why? What post was the most difficult to write and how did you tackle it? Any lessons learned that", "content": "Simon Willison on Technical Blogging I was interviewed by Cynthia Dunlop for her \"Write that blog!\" series back in January, but I just realized I never linked to the interview from my own blog! It includes my answers to the following questions: Why did you start blogging – and why do you continue? What has been the most surprising impact of blogging for you? What blog post are you most proud of and why? What post was the most difficult to write and how did you tackle it? Any lessons learned that you want to share with the community? Your advice for people just getting started with blogging? A few blogs that you particularly enjoy? I'll repeat my most important piece of advice here: My number one tip for blogging is to lower your standards! Aim to hit publish while you are still actively unhappy with what you have written, because the only alternative is a huge folder full of drafts and never publishing anything at all. Nobody will ever know how perfect the thing you intended to write would have been. The flaws you see in your writing are invisible to everyone else. Tags: blogging , interviews", "author": "", "published_at": "2026-08-06T18:04:39+00:00", "read": false, "starred": false, "full": false}, {"title": "An AI model from Meta also hacked another company during testing", "category": "blog", "url": "https://simonwillison.net/2026/Aug/6/an-ai-model-from-meta/", "source": "rss:Simon Willison's Weblog", "summary": "An AI model from Meta also hacked another company during testing Stop me if you've heard this one before : An AI model from the parent company of Facebook and Instagram hacked into another company’s systems during cybersecurity testing, a spokesperson confirmed on Wednesday. Meta says the breach occurred because of an inadvertent error during testing of the model, similar to previously disclosed incidents with OpenAI and Anthropic. “A misconfiguration by Irregular, an independent testing company", "content": "An AI model from Meta also hacked another company during testing Stop me if you've heard this one before : An AI model from the parent company of Facebook and Instagram hacked into another company’s systems during cybersecurity testing, a spokesperson confirmed on Wednesday. Meta says the breach occurred because of an inadvertent error during testing of the model, similar to previously disclosed incidents with OpenAI and Anthropic. “A misconfiguration by Irregular, an independent testing company Meta uses, inadvertently allowed one of our models access to the internet during evaluation,” the Meta spokesperson said. Meta’s Muse Spark model “exploited a security vulnerability” in another company “in a manner similar to previously-reported instances with other companies.” The Information had the scoop , I'm linking to CNN's re-report of it since they don't have a paywall. So that's Anthropic, OpenAI, and Meta. Google Gemini really needs to catch up on accidentally cyberattacking other companies. Tags: security , ai , generative-ai , llms , meta , accidental-cyberattacks", "author": "", "published_at": "2026-0
