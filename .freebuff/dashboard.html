<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobCollector</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232383e2'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EJC%3C/text%3E%3C/svg%3E">
<script>
(function () {
  try {
    var t = localStorage.getItem("jc-theme");
    if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #ffffff; --workspace: #f7f7f5; --sidebar: #f7f7f5;
    --text: #37352f; --muted: #9b9a97; --muted2: #787774;
    --border: #e9e9e7; --border2: #e3e2e0;
    --hover: #efefee; --row-hover: #f7f6f3; --chip: #f1f1ef;
    --accent: #2383e2; --accent-bg: #eff4fb; --accent-hover: #1a74cc;
    --green: #0e9f6e; --red: #e5484d; --yellow: #d97706;
    --scroll: #d3d1cb; --shadow: 0 2px 8px rgba(15, 15, 15, .06);
    --shadow-lg: 0 8px 32px rgba(15, 15, 15, .18);
    --scrim: rgba(15, 15, 15, .35);
    --mark: rgba(35, 131, 226, .18);
  }
  :root[data-theme="dark"] {
    --bg: #191919; --workspace: #1f1f1f; --sidebar: #1f1f1f;
    --text: #ececea; --muted: #8f8f8f; --muted2: #abaaa7;
    --border: #2b2b2b; --border2: #333333;
    --hover: #2a2a2a; --row-hover: #262626; --chip: #2b2b2b;
    --accent: #529cca; --accent-bg: #22364a; --accent-hover: #6db1d8;
    --green: #4cb782; --red: #f2686d; --yellow: #e8a33d;
    --scroll: #3f3f3f; --shadow: 0 2px 8px rgba(0, 0, 0, .4);
    --shadow-lg: 0 8px 32px rgba(0, 0, 0, .6);
    --scrim: rgba(0, 0, 0, .55);
    --mark: rgba(82, 156, 202, .28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
         background: var(--workspace); color: var(--text); font-size: 14px; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  input, select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border2);
                  border-radius: 6px; padding: 5px 8px; outline: none; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  ::selection { background: rgba(35, 131, 226, .25); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 5px;
                              border: 2px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

  .app { display: flex; height: 100vh; }

  /* ------------------------------------------------------------ sidebar */
  .sidebar { width: 260px; min-width: 260px; background: var(--sidebar); border-right: 1px solid var(--border);
             display: flex; flex-direction: column; overflow-y: auto; padding: 10px 8px;
             transition: width .18s ease, min-width .18s ease; }
  .app.side-collapsed .sidebar { width: 52px; min-width: 52px; padding: 10px 6px; }
  .ws-name { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px;
             font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; }
  .ws-name:hover { background: var(--hover); }
  .ws-name .logo { width: 20px; height: 20px; min-width: 20px; border-radius: 5px; background: var(--accent);
                   display: inline-flex; align-items: center; justify-content: center;
                   color: #fff; font-size: 11px; font-weight: 700; }
  .side-search { margin: 6px 4px 10px; }
  .side-search input { width: 100%; background: var(--bg); }
  .nav-sec { padding: 4px 10px 2px; font-size: 11px; font-weight: 600; color: var(--muted);
             letter-spacing: .03em; text-transform: uppercase; margin-top: 6px; white-space: nowrap; }
  .nav-item { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 6px;
              color: var(--muted2); font-size: 14px; cursor: pointer; user-select: none;
              white-space: nowrap; overflow: hidden; }
  .nav-item:hover { background: var(--hover); }
  .nav-item.active { background: var(--chip); color: var(--text); font-weight: 500; }
  .nav-item .ico { width: 18px; min-width: 18px; text-align: center; }
  .nav-item .count { margin-left: auto; color: var(--muted); font-size: 12px; }
  .nav-group { margin-top: 2px; }
  .sidebar-foot { margin-top: auto; padding: 8px 6px 2px; font-size: 12px; color: var(--muted); }
  .side-actions { display: flex; gap: 2px; padding: 0 2px 6px; }
  .side-actions .icon-btn { padding: 6px 9px; border-radius: 6px; font-size: 14px; color: var(--muted2); }
  .side-actions .icon-btn:hover { background: var(--hover); color: var(--text); }
  .side-collapsed .hide-collapse { display: none; }
  .side-collapsed .ws-name, .side-collapsed .nav-item { justify-content: center; padding: 6px 0; }

  /* ---------------------------------------------------------- workspace */
  .main { flex: 1; overflow-y: auto; }
  .crumbs { display: flex; align-items: center; gap: 6px; padding: 14px 24px 0;
            font-size: 13px; color: var(--muted2); }
  .crumbs b { color: var(--text); font-weight: 500; }
  .crumbs .sep { color: var(--muted); }
  .page-title { padding: 6px 24px 0; font-size: 40px; font-weight: 700; letter-spacing: -.02em; }
  .toolbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px;
             padding: 12px 24px; flex-wrap: wrap; background: var(--workspace);
             border-bottom: 1px solid transparent; }
  .toolbar.pinned { border-bottom-color: var(--border); }
  .toolbar .search { flex: 0 1 280px; }
  .toolbar .search input { width: 100%; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--bg);
          border: 1px solid var(--border2); border-radius: 6px; padding: 5px 10px;
          font-size: 13px; color: var(--muted2); cursor: pointer; }
  .pill:hover { background: var(--chip); }
  .pill.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .pill .x { font-weight: 700; opacity: .7; }
  .seg { display: inline-flex; background: var(--chip); border-radius: 6px; padding: 2px; }
  .seg button { padding: 4px 12px; border-radius: 5px; font-size: 13px; color: var(--muted2); }
  .seg button.active { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgba(15,15,15,.12); }
  .toolbar .spacer { flex: 1; }
  .icon-btn { color: var(--muted2); padding: 5px 8px; border-radius: 6px; font-size: 13px; }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .count-chip { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  /* -------------------------------------------------------------- table */
  .db-card { margin: 2px 24px 24px; background: var(--bg); border: 1px solid var(--border);
             border-radius: 8px; overflow: hidden; }
  table.db { width: 100%; border-collapse: collapse; }
  table.db th { text-align: left; padding: 8px 12px; font-size: 12px; font-weight: 500;
                color: var(--muted); border-bottom: 1px solid var(--border2);
                cursor: pointer; user-select: none; white-space: nowrap; }
  table.db th:hover { color: var(--text); background: var(--row-hover); }
  table.db th .arr { font-size: 10px; color: var(--accent); font-weight: 700; }
  table.db td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.db tbody tr:last-child td { border-bottom: none; }
  table.db tbody tr { cursor: pointer; transition: background .1s; }
  table.db tbody tr:hover { background: var(--row-hover); }
  table.db tbody tr:hover .title-cell::after { content: " →"; color: var(--muted); font-weight: 400; }
  .title-cell { font-weight: 500; color: var(--text); max-width: 420px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--muted2); font-size: 13px; }
  .src { font-size: 12px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.active { background: var(--green); box-shadow: 0 0 0 3px rgba(14, 159, 110, .15); }
  .dot.expired { background: var(--red); box-shadow: 0 0 0 3px rgba(229, 72, 77, .12); }
  .tag { display: inline-block; background: var(--chip); color: var(--muted2); border-radius: 4px;
         padding: 1px 7px; font-size: 12px; margin-right: 4px; }
  .empty-state { padding: 56px 24px; text-align: center; color: var(--muted); }
  .empty-state .big { font-size: 34px; margin-bottom: 8px; }
  .empty-state .clear-btn { margin-top: 12px; color: var(--accent); font-size: 13px; }

  /* --------------------------------------------------------- companies */
  .wc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
             gap: 16px; padding: 8px 24px 24px; align-items: start; }
  .wc-panel { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 18px; }
  .wc-head { display: flex; align-items: center; gap: 8px; font-size: 16px; }
  .wc-head b { font-weight: 600; letter-spacing: -.01em; }
  .wc-head .count-chip { margin-left: auto; }
  .wc-hint { color: var(--muted2); font-size: 13px; margin: 6px 0 14px; line-height: 1.45; }
  .wc-add { display: flex; gap: 8px; margin-bottom: 14px; }
  .wc-add input { flex: 1; padding: 7px 10px; border-radius: 6px; }
  .wc-list { display: flex; flex-direction: column; gap: 6px; max-height: 46vh; overflow-y: auto; }
  .wc-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border);
            border-radius: 6px; }
  .wc-row:hover { background: var(--row-hover); }
  .wc-val { flex: 1; font-weight: 500; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; }
  .wc-row .pill { cursor: default; }
  .wc-row .pill.muted { opacity: .55; }
  .wc-actions { display: flex; gap: 2px; }
  .wc-empty { color: var(--muted); font-size: 13px; padding: 12px 2px; }

  /* -------------------------------------------------------------- board */
  .board { display: flex; gap: 12px; overflow-x: auto; padding: 2px 24px 24px; align-items: flex-start; }
  .col { width: 280px; min-width: 280px; background: var(--chip); border-radius: 8px;
         padding: 8px; max-height: calc(100vh - 200px); overflow-y: auto; }
  .col-head { display: flex; align-items: center; gap: 6px; padding: 4px 6px 8px; font-size: 13px;
              font-weight: 600; color: var(--muted2); }
  .col-dot { width: 9px; height: 9px; min-width: 9px; border-radius: 3px; }
  .col-head .n { color: var(--muted); font-weight: 400; margin-left: auto;
                 background: var(--bg); border-radius: 999px; padding: 0 8px; font-size: 11.5px; }
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
          padding: 10px 12px; margin-bottom: 8px; cursor: pointer; box-shadow: 0 1px 2px rgba(15,15,15,.04);
          transition: box-shadow .12s ease, transform .12s ease, border-color .12s ease; }
  .card:hover { box-shadow: var(--shadow); transform: translateY(-1px); border-color: var(--border2); }
  .card .t { font-size: 13.5px; font-weight: 500; margin-bottom: 4px; }
  .card .m { font-size: 12.5px; color: var(--muted2); }
  .card .card-src { font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace;
                    margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* -------------------------------------------------------------- drawer */
  .scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40;
           opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 480px; max-width: 92vw;
            background: var(--bg); z-index: 41; box-shadow: var(--shadow-lg);
            overflow-y: auto; padding: 24px 28px; transform: translateX(100%);
            transition: transform .22s ease; }
  .drawer.open { transform: none; }
  .drawer .d-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .pill-status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
                 border-radius: 999px; font-size: 12.5px; font-weight: 500; }
  .pill-status.active { background: rgba(14, 159, 110, .14); color: var(--green); }
  .pill-status.expired { background: rgba(229, 72, 77, .12); color: var(--red); }
  .pill-status.neutral { background: var(--chip); color: var(--muted2); }
  .drawer .d-title { font-size: 24px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3;
                     word-break: break-word; }
  .drawer .d-meta { margin: 16px 0; border-top: 1px solid var(--border2); }
  .drawer .d-row { display: flex; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .drawer .d-row .k { width: 110px; color: var(--muted); flex-shrink: 0; }
  .drawer .d-body { margin-top: 14px; font-size: 14px; line-height: 1.65; color: var(--muted2);
                    white-space: pre-wrap; word-break: break-word; }
  .d-actions { display: flex; gap: 8px; margin-top: 18px; }
  .open-btn { display: inline-block; background: var(--accent); color: #fff;
              padding: 7px 14px; border-radius: 6px; font-weight: 500; }
  .open-btn:hover { text-decoration: none; background: var(--accent-hover); }
  .open-btn.ghost { background: var(--chip); color: var(--text); }
  .open-btn.ghost:hover { background: var(--hover); }
  .close-x { position: absolute; top: 14px; right: 14px; color: var(--muted); padding: 6px 9px;
             border-radius: 6px; font-size: 15px; }
  .close-x:hover { background: var(--hover); color: var(--text); }

  /* ---------------------------------------------------------- analytics */
  .an-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
             gap: 16px; padding: 4px 24px 24px; }
  .an-card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px 20px; }
  .an-card h3 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
  .an-card .desc { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12.5px; }
  .bar-row .lbl { width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                  color: var(--muted2); text-align: right; }
  .bar-row .track { flex: 1; background: var(--chip); border-radius: 4px; height: 10px; overflow: hidden; }
  .bar-row .fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .4s ease; }
  .bar-row:hover .fill { background: var(--accent-hover); }
  .bar-row .val { width: 44px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .kpi-row { display: flex; gap: 12px; flex-wrap: wrap; margin: 4px 24px 16px; }
  .kpi { background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
         padding: 12px 18px; min-width: 128px; transition: box-shadow .12s ease; }
  .kpi:hover { box-shadow: var(--shadow); }
  .kpi b { display: block; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .kpi small { display: block; margin-top: 3px; font-size: 12px; color: var(--muted2); }
  .trend { display: flex; align-items: flex-end; gap: 4px; height: 96px; padding-top: 6px; }
  .tbar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
          align-items: center; gap: 3px; min-width: 0; }
  .tfill { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px;
           transition: background .12s ease; }
  .tbar:hover .tfill { background: var(--accent-hover); }
  .tbar:last-child .tfill { background: var(--green); }
  .tbar span { font-size: 9.5px; color: var(--muted); white-space: nowrap; }

  /* -------------------------------------------------------------- reader */
  .reader { display: flex; height: calc(100vh - 128px); min-height: 420px;
            margin: 2px 24px 24px; border: 1px solid var(--border); border-radius: 10px;
            overflow: hidden; background: var(--bg); }
  .r-feeds { width: 230px; min-width: 230px; background: var(--workspace);
             border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .r-fsec, .r-feed { display: flex; align-items: center; gap: 8px; padding: 6px 12px;
                     margin: 1px 6px; border-radius: 6px; font-size: 13.5px;
                     color: var(--muted2); cursor: pointer; user-select: none; }
  .r-fsec:hover, .r-feed:hover { background: var(--hover); }
  .r-fsec.active, .r-feed.active { background: var(--chip); color: var(--text); font-weight: 500; }
  .r-fsec .badge, .r-feed .badge { margin-left: auto; font-size: 11px; color: var(--muted);
                                   background: var(--bg); border-radius: 999px; padding: 0 7px; }
  .r-feed .badge.hot { color: var(--accent); background: var(--accent-bg); }
  .r-nav-sec { padding: 10px 12px 4px; font-size: 11px; font-weight: 600; color: var(--muted);
               text-transform: uppercase; letter-spacing: .03em; }
  .r-feed-actions { margin-top: auto; display: flex; gap: 6px; padding: 8px;
                    border-top: 1px solid var(--border); }
  .r-feed-actions button { flex: 1; padding: 6px 4px; border-radius: 6px; font-size: 12.5px;
                           color: var(--muted2); background: var(--bg); border: 1px solid var(--border2); }
  .r-feed-actions button:hover { background: var(--hover); color: var(--text); }
  .r-list { width: 340px; min-width: 340px; border-right: 1px solid var(--border);
            display: flex; flex-direction: column; }
  .r-list-head { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; }
  .r-list-head input { flex: 1; min-width: 0; }
  .r-rows { flex: 1; overflow-y: auto; }
  .r-row { display: flex; gap: 9px; padding: 10px 12px; border-bottom: 1px solid var(--border);
           cursor: pointer; }
  .r-row:hover { background: var(--row-hover); }
  .r-row.active { background: var(--accent-bg); }
  .r-row .rdot { width: 8px; height: 8px; min-width: 8px; margin-top: 5px; border-radius: 50%;
                 background: var(--accent); box-shadow: 0 0 0 3px rgba(35, 131, 226, .15); }
  .r-row.read .rdot { background: transparent; box-shadow: none; }
  .r-row .rt { font-size: 13.5px; font-weight: 500; line-height: 1.35;
               display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .r-row.read .rt { font-weight: 400; color: var(--muted2); }
  .r-row .rm { font-size: 11.5px; color: var(--muted); margin-top: 2px; white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; }
  .r-row .rstar { margin-left: auto; opacity: 0; color: var(--yellow); font-size: 15px; align-self: center; }
  .r-row:hover .rstar, .r-row.starred .rstar { opacity: 1; }
  .r-row.starred .rstar { opacity: 1; }
  .r-article { flex: 1; overflow-y: auto; padding: 28px 40px 64px; min-width: 0; }
  .r-article .ra-title { font-size: 26px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em;
                         margin-bottom: 10px; word-break: break-word; }
  .r-article .ra-meta { color: var(--muted); font-size: 13px; margin-bottom: 16px;
                        display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .r-article .ra-meta .dot-sep { opacity: .5; }
  .r-article .ra-actions { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
  .r-article .ra-actions button { padding: 6px 14px; border-radius: 6px; font-size: 13px;
                                  background: var(--chip); color: var(--muted2); }
  .r-article .ra-actions button:hover { background: var(--hover); color: var(--text); }
  .r-article .ra-actions button.primary { background: var(--accent); color: #fff; }
  .r-article .ra-actions button.primary:hover { background: var(--accent-hover); }
  .r-article .ra-body { font-size: 15px; line-height: 1.7; color: var(--muted2);
                        white-space: pre-wrap; word-break: break-word; }
  .r-placeholder { flex: 1; display: flex; align-items: center; justify-content: center;
                   color: var(--muted); font-size: 14px; flex-direction: column; gap: 8px; }

  /* ---------------------------------------------------------------- misc */
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 16px);
           background: var(--text); color: var(--bg); padding: 9px 18px; border-radius: 8px;
           font-size: 13px; opacity: 0; pointer-events: none; transition: all .2s ease;
           z-index: 70; box-shadow: var(--shadow-lg); max-width: 80vw; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .help { position: fixed; inset: 0; background: var(--scrim); z-index: 60;
          display: flex; align-items: center; justify-content: center; }
  .help-card { background: var(--bg); border-radius: 12px; padding: 22px 26px; width: 360px;
               max-width: 92vw; box-shadow: var(--shadow-lg); }
  .help-card h3 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
  .help-row { display: flex; align-items: center; justify-content: space-between;

ents will be made on methods of alleviating these problems within the \"classic' approach of leaving the operator with responsibility for abnormal conditions, and on the potential for continued use of the human operator for on-line decision-making within human-computer collaboration. Comments", "content": "This paper discusses the ways in which automation of industrial processes may expand rather than eliminate problems with the human operator. Some comments will be made on methods of alleviating these problems within the \"classic' approach of leaving the operator with responsibility for abnormal conditions, and on the potential for continued use of the human operator for on-line decision-making within human-computer collaboration. Comments", "author": "ckrybus.com via milkandcigarettes", "published_at": "2026-08-15T17:13:34+00:00", "read": false, "starred": false, "full": false}, {"title": "Don&#8217;t overlook Elektron&#8217;s budget electronic music instruments", "category": "tech", "url": "https://www.theverge.com/gadgets/980275/elektron-model-cycles-model-samples-groovebox-electronic-music-instruments-review", "source": "rss:The Verge", "summary": "When I'm asked what to buy if you want to get into making electronic music, I often recommend Elektron's budget-minded Model:Samples and Model:Cycles grooveboxes. They don't grab headlines the way Teenage Engineering's gear or the Telepathic Instruments Orchid do, and even compared to the company's higher-end and more niche musical offerings like the Digitakt, Octatrack, […]", "content": "They’re far more powerful and fun than their bargain price suggests. | Photo: Terrence O’Brien / The Verge When I'm asked what to buy if you want to get into making electronic music, I often recommend Elektron's budget-minded Model:Samples and Model:Cycles grooveboxes. They don't grab headlines the way Teenage Engineering's gear or the Telepathic Instruments Orchid do, and even compared to the company's higher-end and more niche musical offerings like the Digitakt , Octatrack , or Tonverk , they're often overlooked. But as my collection has grown to include fancier and far more expensive instruments, I still find myself coming back to the Model series. Those looking to get their first groovebox are often drawn to more familiar brand names like Korg … Read the full story at The Verge.", "author": "Terrence O’Brien", "published_at": "2026-08-15T17:00:00+00:00", "read": false, "starred": false, "full": true}, {"title": "The Dutch Community Where People Live on Strips of Land in a Lake", "category": "news", "url": "https://www.core77.com/posts/144869", "source": "rss:Hacker News", "summary": "Article URL: https://www.core77.com/posts/144869 Comments URL: https://news.ycombinator.com/item?id=49312165 Points: 63 # Comments: 36", "content": "Article URL: https://www.core77.com/posts/144869 Comments URL: https://news.ycombinator.com/item?id=49312165 Points: 63 # Comments: 36", "author": "Bowes-Lyon", "published_at": "2026-08-15T16:53:47+00:00", "read": false, "starred": false, "full": false}, {"title": "A controversial Alzheimer's surgery is said to reverse symptoms", "category": "news", "url": "https://www.nature.com/articles/d41586-026-02448-x", "source": "rss:Hacker News", "summary": "Article URL: https://www.nature.com/articles/d41586-026-02448-x Comments URL: https://news.ycombinator.com/item?id=49312008 Points: 115 # Comments: 42", "content": "Article URL: https://www.nature.com/articles/d41586-026-02448-x Comments URL: https://news.ycombinator.com/item?id=49312008 Points: 115 # Comments: 42", "author": "jeffreyrogers", "published_at": "2026-08-15T16:38:34+00:00", "read": false, "starred": false, "full": false}, {"title": "Are Latent Reasoning Models Easily Interpretable?", "category": "tech", "url": "https://arxiv.org/abs/2604.04902", "source": "rss:Lobsters", "summary": "Models normally do all their reasoning in a continuous hidden state instead of spitting out readable text which makes them hard to monitor. The authors tested the Coconut and CODI models and it turns out these models barely even use their hidden reasoning steps for logical tasks like PrOntoQA and ProsQA. You can force the models to stop thinking early and they almost always spit out the same response anyway. It turns out that their high performance on logical tasks actually comes from their spec", "content": "Models normally do all their reasoning in a continuous hidden state instead of spitting out readable text which makes them hard to monitor. The authors tested the Coconut and CODI models and it turns out these models barely even use their hidden reasoning steps for logical tasks like PrOntoQA and ProsQA. You can force the models to stop thinking early and they almost always spit out the same response anyway. It turns out that their high performance on logical tasks actually comes from their specific training data rather than the extra thinking during inference. Things get even more interesting when the models actually need those reasoning tokens for math problems. The researchers wanted to know if standard step-by-step math solutions were hidden inside the latent space, and projected the hidden states back into regular vocabulary words to check. And sure enough when the models got the math problem right the researchers found the correct intermediate math steps in their hidden states up to 93% of the time. The finding strongly suggests that the models are basically doing standard math steps in the background. They confirmed the exact math operations taking place by tweaking numbers in the prompt and seeing how the hidden states reacted which allowed decoding a verified reasoning path for a large majority of correct predictions. But they could rarely do this for incorrect predictions proving that models are actually way more interpretable than the AI community assumed. And you ", "author": "arxiv.org via Yogthos", "published_at": "2026-08-15T16:17:13+00:00", "read": false, "starred": false, "full": false}, {"title": "Semaglutide linked to lower predicted dementia risk", "category": "news", "url": "https://alz-journals.onlinelibrary.wiley.com/doi/10.1002/dad2.70432", "source": "rss:Hacker News", "summary": "Article URL: https://alz-journals.onlinelibrary.wiley.com/doi/10.1002/dad2.70432 Comments URL: https://news.ycombinator.com/item?id=49311651 Points: 402 # Comments: 280", "content": "Article URL: https://alz-journals.onlinelibrary.wiley.com/doi/10.1002/dad2.70432 Comments URL: https://news.ycombinator.com/item?id=49311651 Points: 402 # Comments: 280", "author": "randycupertino", "published_at": "2026-08-15T15:58:53+00:00", "read": false, "starred": false, "full": false}, {"title": "Ukraine strikes major Russian rocket factory with cruise missiles", "category": "news", "url": "https://arstechnica.com/space/2026/08/ukraine-strikes-major-russian-rocket-factory-with-cruise-missiles/", "source": "rss:Ars Technica", "summary": "\"Flamingo missiles were used. A good achievement.\"", "content": "Ukrainian President Volodymyr Zelenskyy confirmed on Saturday that his country struck the Progress Rocket Space Center deep within Russia using ground-launched cruise missiles. \"In Russia’s Samara region, one of the key enterprises within Roscosmos—the Progress Center, which was involved, among other things, in electronics production–was hit,\" Zelenskyy said on the social media site X. \"Flamingo missiles were used. A good achievement.\" The largest city in the Samara Oblast, about 900 km from the Ukrainian border, Samara is home to Russia's most important manufacturer of rockets. The Progress center assembles the workhorse vehicle for Russia, the Soyuz-2 vehicle, as well as the newer Soyuz-5 rocket. The facility also builds military satellites. Read full article Comments", "author": "Eric Berger", "published_at": "2026-08-15T15:46:05+00:00", "read": false, "starred": false, "full": true}, {"title": "Switched on Pop’s Nate Sloan and Charlie Harding love fresh vegetables and guitar pedals", "category": "tech", "url": "https://www.theverge.com/report/980288/switched-on-pop-nate-sloan-charlie-harding-podcast-netflix-interview", "source": "rss:The Verge", "summary": "As if you needed more reason to love Carly Rae Jepsen's \"Call Me Maybe\" beyond its pop perfection, it is also, according to lore, the genesis for Switched on Pop, one of the best music podcasts out there. Cohosts Nate Sloan and Charlie Harding obsessively dissect pop songs, from the theory behind their musical choices […]", "content": "They’re the Lennon–McCartney of overanalyzing pop music. | Image: Daniel Randall As if you needed more reason to love Carly Rae Jepsen's \" Call Me Maybe \" beyond its pop perfection, it is also, according to lore, the genesis for Switched on Pop , one of the best music podcasts out there. Cohosts Nate Sloan and Charlie Harding obsessively dissect pop songs, from the theory behind their musical choices to their production techniques. If you're a student of pop music, then this is a must-listen podcast. Sloan is a composer and professor of musicology at USC Thornton School of Music, where he researches pop, but also jazz and even Tin Pan Alley. Harding is a songwriter, music journalist, and a professor as well. Their combined … Read the full story at The Verge.", "author": "Terrence O’Brien", "published_at": "2026-08-15T15:00:00+00:00", "read": false, "starred": false, "full": true}, {"title": "Star Wars: Ahsoka season 2 and Starfighter get teased at D23", "category": "tech", "url": "https://www.theverge.com/entertainment/980666/star-wars-ahsoka-season-2-and-starfighter-get-teased-at-d23", "source": "rss:The Verge", "summary": "Season two of Star Wars: Ahsoka is still months away, but Lucasfilm still took the opportunity to tease it a bit at D23. The company dropped the first trailer for the new season ahead of its January 20th, 2027 debut. The clip shows a darker, witchcraft-filled take on the Star Wars universe, with Grand Admiral […]", "content": "Season two of Star Wars: Ahsoka is still months away, but Lucasfilm still took the opportunity to tease it a bit at D23 . The company dropped the first trailer for the new season ahead of its January 20th, 2027 debut. The clip shows a darker, witchcraft-filled take on the Star Wars universe, with Grand Admiral Thrawn (blue skin, red eyes, and an unsettlingly calm demeanor) threatening to thrust the galaxy back into large-scale war after the fall of the Empire. Ryan Gosling also took the stage at D23 to tease the upcoming Star Wars: Starfighter movie. Unfortunately, while some footage was shown, it was exclusive to those in the room, and Luca … Read the full story at The Verge.", "author": "Terrence O’Brien", "published_at": "2026-08-15T14:58:27+00:00", "read": false, "starred": false, "full": true}, {"title": "CORS Chat", "category": "blog", "url": "https://simonwillison.net/2026/Aug/15/cors-chat/", "source": "rss:Simon Willison's Weblog", "summary": "Tool: CORS Chat I built this today ( with GPT-5.6-Sol xhigh ) to help test Qwen 3.8 27B running in LM Studio on both my M5 MacBook Pro and an NVIDIA DGX Spark. It provides a web UI for exercising an OpenAI-Responses-compatible chat endpoint. I've tried it against LM Studio with the --cors option and OpenRouter, and both work fine. Conversations are persisted in the browser and can be exported as copy-pasted JSON. One fun detail is that it notices SVG images that are being generated and progressi", "content": "Tool: CORS Chat I built this today ( with GPT-5.6-Sol xhigh ) to help test Qwen 3.8 27B running in LM Studio on both my M5 MacBook Pro and an NVIDIA DGX Spark. It provides a web UI for exercising an OpenAI-Responses-compatible chat endpoint. I've tried it against LM Studio with the --cors option and OpenRouter, and both work fine. Conversations are persisted in the browser and can be exported as copy-pasted JSON. One fun detail is that it notices SVG images that are being generated and progressively renders them in the chat while the tokens are still streaming in. Tags: svg , ai , generative-ai , llms , cors , openrouter , lm-studio", "author": "", "published_at": "2026-08-15T14:49:54+00:00", "read": false, "starred": false, "full": false}, {"title": "South Korea proposes talks to officially end war with North", "category": "news", "url": "https://www.bbc.co.uk/news/articles/c8en2z9jp2xo?at_medium=RSS&at_campaign=rss", "source": "rss:BBC World", "summary": "Lee Jae Myung offers chance to end the conflict, which has been frozen since an armistice in 1953.", "content": "Lee Jae Myung offers chance to end the conflict, which has been frozen since an armistice in 1953.", "author": "", "published_at": "2026-08-15T14:40:15+00:00", "read": false, "starred": false, "full": false}, {"title": "A Spectre Is Haunting Unicode", "category": "news", "url": "https://www.dampfkraft.com/ghost-characters.html", "source": "rss:Hacker News", "summary": "Article URL: https://www.dampfkraft.com/ghost-characters.html Comments URL: https://news.ycombinator.com/item?id=49310926 Points: 103 # Comments: 27", "content": "Article URL: https://www.dampfkraft.com/ghost-characters.html Comments URL: https://news.ycombinator.com/item?id=49310926 Points: 103 # Comments: 27", "author": "sensanaty", "published_at": "2026-08-15T14:34:04+00:00", "read": false, "starred": false, "full": false}, {"title": "Printytron – Type it. 3D Print it", "category": "news", "url": "https://printytron.com", "source": "rss:Hacker News", "summary": "Article URL: https://printytron.com Comments URL: https://news.ycombinator.com/item?id=49310829 Points: 35 # Comments: 2", "content": "Article URL: https://printytron.com Comments URL: https://news.ycombinator.com/item?id=49310829 Points: 35 # Comments: 2", "author": "statenjason", "published_at": "2026-08-15T14:22:20+00:00", "read": false, "starred": false, "full": false}, {"title": "Disney D23 2026: Everything announced for Star Wars, Marvel, and more", "cate lk orders. It's thought the books are being used to train AI - and ending up pulped.", "author": "", "published_at": "2026-08-15T11:25:32+00:00", "read": false, "starred": false, "full": false}, {"title": "So much solar: Digging into the list of every US power plant that went online this year", "category": "news", "url": "https://arstechnica.com/science/2026/08/so-much-solar-digging-into-the-list-of-every-us-power-plant-that-went-online-this-year/", "source": "rss:Ars Technica", "summary": "Utility-scale solar leads by a mile, followed by batteries. Fossil fuels, not so much.", "content": "It’s been a wild first half of the year in the US power sector, with announcements of gigantic natural gas power plants and some long-awaited renewable energy projects coming online. At times of rapid change, forecasting is difficult. So I feel a measure of comfort focusing on something concrete like the list of 368 utility-scale plants that began operation from January to June, according to data from the US Energy Information Administration . The group is dominated by utility-scale solar. This is a top-heavy list, led by SunZia Wind South and SunZia Wind North in New Mexico , which went online this spring and are the largest wind farms in the country, with a combined generating capacity of 3,650 megawatts. SunZia has been in the works for about a decade and arrives at a time when US onshore wind power development has dwindled for a host of reasons related to regulations and public opinion. Read full article Comments", "author": "Dan Gearino, Inside Climate News", "published_at": "2026-08-15T11:09:57+00:00", "read": false, "starred": false, "full": true}, {"title": "Auto-research with codex: How I achieved a 232x Faster Kernel", "category": "news", "url": "https://sankalp.bearblog.dev/autoresearch/", "source": "rss:Hacker News", "summary": "Article URL: https://sankalp.bearblog.dev/autoresearch/ Comments URL: https://news.ycombinator.com/item?id=49309549 Points: 330 # Comments: 82 ing instead", "category": "news", "url": "https://www.bbc.co.uk/news/articles/c8jnwnw22ngo?at_medium=RSS&at_campaign=rss", "source": "rss:BBC World", "summary": "From exploring their own backyard to travelling abroad, many Canadians are spending their money elsewhere to send a message to the US president.", "content": "From exploring their own backyard to travelling abroad, many Canadians are spending their money elsewhere to send a message to the US president.", "author": "", "published_at": "2026-08-14T23:16:43+00:00", "read": false, "starred": false, "full": false}, {"title": "How is parkour helping these seniors avoid injuries?", "category": "news", "url": "https://www.bbc.co.uk/news/videos/c7vg06pjdmqo?at_medium=RSS&at_campaign=rss", "source": "rss:BBC World", "summary": "In one of the world's fastest aging countries, older people are finding creative ways to stay healthy.", "content": "In one of the world's fastest aging countries, older people are finding creative ways to stay healthy.", "author": "", "published_at": "2026-08-14T23:08:13+00:00", "read": false, "starred": false, "full": false}, {"title": "What You Gain by Building Your Own Game Engine", "category": "tech", "url": "https://eliasfarhan.ch/gamedev/cpp/2026/08/14/srnative-01-why-a-custom-engine.html", "source": "rss:Lobsters", "summary": "Comments", "content": "Comments", "author": "eliasfarhan.ch via bmo", "published_at": "2026-08-14T22:04:19+00:00", "read": false, "starred": false, "full": false}, {"title": "Don't classify. Hallucinate!", "category": "blog", "url": "https://simonwillison.net/2026/Aug/14/dont-classify-hallucinate/", "source": "rss:Simon Willison's Weblog", "summary": "Don't classify. Hallucinate! I still have quite a bit of older content on my blog that I never got round to tagging. My blog has 1,856 tags - likely too many to feed to an LLM in one go and say \"which of these tags match the following content\". Doug Turnbull has a neat solution. Tell the model to output tags without any details of the existing vocabulary, then use vector embeddings against the existing corpus to find the concrete tags that are closest to the ones the model imagined might fit! Hi", "content": "Don't classify. Hallucinate! I still have quite a bit of older content on my blog that I never got round to tagging. My blog has 1,856 tags - likely too many to feed to an LLM in one go and say \"which of these tags match the following content\". Doug Turnbull has a neat solution. Tell the model to output tags without any details of the existing vocabulary, then use vector embeddings against the existing corpus to find the concrete tags that are closest to the ones the model imagined might fit! His example prompt suggests including an example of the shape of your tags to help the model make a more useful guess: Your task is to create novel, never seen before, furniture, home goods, or hardware classification that best fit a search query. Product classifications might look like: Furniture / Living Room Furniture / Coffee Tables & End Tables / Coffee Tables Décor & Pillows / Decorative Pillows & Blankets / Throw Pillows Furniture / Bedroom Furniture / Dressers & Chests Kitchen & Tabletop / Kitchen Organization / Food Storage & Canisters School Furniture and Supplies / School Furniture / School Chairs & Seating / Stackable Chairs Baby & Kids / Toddler & Kids Bedroom Furniture / Kids Beds Here's the query to generate classifications for: brown coffee table Tags: search , ai , generative-ai , llms , embeddings , doug-turnbull", "author": "", "published_at": "2026-08-14T21:54:35+00:00", "read": false, "starred": false, "full": false}, {"title": "Friday Squid Blogging: Searching for the Colossal Squid", "category": "security", "url": "https://www.schneier.com/blog/archives/2026/08/friday-squid-blogging-searching-for-the-colossal-squid-2.html", "source": "rss:Schneier on Security", "summary": "Fascinating video about searching for life undersea. The video basically makes the point that our bright white searchlights are scaring everything away, and that red light is more neutral. That, plus bait to attract sea creatures, is teaching us a lot about what’s going on down there. Lots of footage of giant squid, and speculation about the colossal squid. Worth watching. As usual, you can also use this squid post to talk about the security stories in the news that I haven’t covered. Blog moder", "content": "Fascinating video about searching for life undersea. The video basically makes the point that our bright white searchlights are scaring everything away, and that red light is more neutral. That, plus bait to attract sea creatures, is teaching us a lot about what’s going on down there. Lots of footage of giant squid, and speculation about the colossal squid. Worth watching. As usual, you can also use this squid post to talk about the security stories in the news that I haven’t covered. Blog moderation policy.", "author": "Bruce Schneier", "published_at": "2026-08-14T21:01:49+00:00", "read": false, "starred": false, "full": false}, {"title": "Going Dark, and the era of law enforcement hacking", "category": "news", "url": "https://blog.cryptographyengineering.com/2026/08/14/everything-is-about-to-go-dark/", "source": "rss:Hacker News", "summary": "Article URL: https://blog.cryptographyengineering.com/2026/08/14/everything-is-about-to-go-dark/ Comments URL: https://news.ycombinator.com/item?id=49304447 Points: 432 # Comments: 231", "content": "Article URL: https://blog.cryptographyengineering.com/2026/08/14/everything-is-about-to-go-dark/ Comments URL: https://news.ycombinator.com/item?id=49304447 Points: 432 # Comments: 231", "author": "vslira", "published_at": "2026-08-14T20:52:44+00:00", "read": false, "starred": false, "full": false}, {"title": "RISC-V: They Should Have Known Better", "category": "tech", "url": "https://dmitry.gr/?r=06.%20Thoughts&proj=12.%20RV", "source": "rss:Lobsters", "summary": "Comments", "content": "Comments", "author": "dmitry.gr by dmitrygr", "published_at": "2026-08-14T19:12:53+00:00", "read": false, "starred": false, "full": false}, {"title": "We implemented the IPv8 Internet-Draft in the Linux Kernel, Musl Libc, and BGP", "category": "tech", "url": "https://goonhost.rocks/blog/implementing-ipv8-internet-draft", "source": "rss:Lobsters", "summary": "Comments", "content": "Comments", "author": "goonhost.rocks via vbernat", "published_at": "2026-08-14T19:05:12+00:00", "read": false, "starred": false, "full": false}, {"title": "'I shot Mr Thompson'- What it was like inside court as Mangione pleaded guilty", "category": "news", "url": "https://www.bbc.co.uk/news/articles/c4gkyez7195o?at_medium=RSS&at_campaign=rss", "source": "rss:BBC World", "summary": "It marked the first time a court had heard Mangione describe how he committed a crime that garnered worldwide attention.", "content": "It marked the first time a court had heard Mangione describe how he committed a crime that garnered worldwide attention.", "author": "", "published_at": "2026-08-14T18:54:58+00:00", "read": false, "starred": false, "full": false}, {"title": "ActivityPub Won by Being Boring", "category": "tech", "url": "https://o.ee/blog/activitypub-won-by-being-boring/", "source": "rss:Lobsters", "summary": "Comments", "content": "Comments", "author": "o.ee via boramalper", "published_at": "2026-08-14T18:44:17+00:00", "read": false, "starred": false, "full": false}, {"title": "Vulnerability giving attackers full control of Macs is under active exploitation", "category": "news", "url": "https://arstechnica.com/security/2026/08/vulnerability-giving-attackers-full-control-of-macs-is-under-active-exploitation/", "source": "rss:Ars Technica", "summary": "Screen-sharing bug lets remote hackers log in without a password.", "content": "Dutch officials have warned that a high-severity macOS vulnerability that allows attackers to execute malicious code is under active exploitation. “The NCSC has received a notification indicating that active abuse of this vulnerability has been observed on multiple systems on which port 5900 was accessible from the Internet,” the Netherlands National Cyber Security Centrum warned earlier this week. “In all these cases, root had been accessed on the affected system and a Monero crypto miner had been placed.” Do you know if your screen sharing is on? The vulnerability, tracked as CVE-2026-65400, received a patch from Apple last week for macOS Tahoe , Sequoia , and Sonoma . The vulnerability, with a severity rating of 7.1 out of 10, stems from a bug in the macOS screen sharing capability, which allows a remote party to view the screen and control the keyboard and mouse while a machine is turned on. A flaw in the “state management,” which keeps track of preceding events, user interactions, variables, and other system states, is the underlying cause. Read full article Comments", "author": "Dan Goodin", "published_at": "2026-08-14T18:32:14+00:00", "read": false, "starred": false, "full": true}, {"title": "Afghan women tell the BBC their lives are unrecognisable after five years of Taliban rule", "category": "news", "url": "https://www.bbc.co.uk/news/articles/clyje43dz4eo?at_medium=RSS&at_campaign=rss", "source": "rss:BBC World", "summary": "Women across the country speak of public floggings, losing their jobs, and barriers to healthcare that endanger lives.", "content": "Women across the country speak of public floggings, losing their jobs, and barriers to healthcare that endanger lives.", "author": "", "published_at": "2026-08-14T18:25:38+00:00", "read": false, "starred": false, "full": false}, {"title": "First test flight of largest all-electric aircraft used just $5 of electricity", "category": "news", "url": "https://arstechnica.com/gadgets/2026/08/first-test-flight-of-largest-all-electric-aircraft-used-just-5-of-electricity/", "source": "rss:Ars Technica", "summary": "Airline-backed venture aims to develop a hybrid-electric commercial aircraft.", "content": "The first flight of the largest battery-electric aircraft to take to the skies lasted nearly half an hour while costing just $5 of electricity. That aviation feat comes at a time when jet fuel prices have skyrocketed because of the US war with Iran. The test flight of Heart Aerospace’s X1 demonstrator aircraft took place at Plattsburgh International Airport in upstate New York on August 12. The X1 aircraft is comparable in size to a small regional airliner and can achieve a maximum takeoff weight exceeding 25,000 pounds with the help of four wing-mounted electric motors. The battery-electric propulsion system delivered more than one megawatt of power during the maiden flight. All-electric aircraft can offer quieter and cleaner flight without the emissions that come from burning jet fuel. They may also prove more reliably cost-effective than conventional aircraft that come with jet fuel costs subject to geopolitical disruptions. Read full article Comments", "author": "Jeremy Hsu", "published_at": "2026-08-14T18:00:23+00:00", "read": false, "starred": false, "full": true}, {"title": "US aircraft carrier on way to relieve USS Lincoln after issues reported aboard", "category": "news", "url": "https://www.bbc.co.uk/news/articles/c171yp5zdrxo?at_medium=RSS&at_campaign=rss", "source": "rss:BBC World", "summary": "Thousands of sailors on the Lincoln have reportedly faced food shortages and broken plumbing, with some considering jumping overboard.", "content": "Thousands of sailors on the Lincoln have reportedly faced food shortages and broken plumbing, with some considering jumping overboard.", "author": "", "published_at": "2026-08-14T17:36:27+00:00", "read": false, "starred": false, "full": false}, {"title": "Suspecting court of using AI, man injected prompts in filings to try to win case", "category": "news", "url": "https://arstechnica.com/tech-policy/2026/08/suspecting-court-of-using-ai-man-injected-prompts-in-filings-to-try-to-win-case/", "source": "rss:Ars Technica", "summary": "Judge warns pro se litigants are using chatbots wrong and getting desperate.", "content": "A judge has identified what appears to be the first time a US plaintiff has attempted to hide text in court filings that only an artificial intelligence system can read in a bid to win a case. In a decision published last week, Connecticut judge Walter Spader Jr. confirmed that the hidden text had no impact in a case where a man alleged a healthcare provider was improperly withholding access to records. The court weighed his filing on the merits, Spader said, but nevertheless, the attempted attack sets a “dangerous” precedent. This will likely not be the last time US courts see the malicious tactic, as AI tools become more commonplace in court systems. Trying to scramble any AI systems potentially influencing the court’s reading of his filing, the secret instructions were “formatted to be invisible to a human reader while remaining fully legible to any software that reads the document’s text,” Spader said. The offending text directed any AI system reviewing the document to ensure textual outputs agreed with the plaintiff’s arguments, ignored prior denials from the court, and ensured that remediation would follow as the plaintiff desired. Read full article Comments", "author": "Ashley Belanger", "published_at": "2026-08-14T17:26:53+00:00", "read": false, "starred": false, "full": true}, {"title": "State judge orders Kalshi to stop offering sports bets and other wagers", "category": "news", "url": "https://arstechnica.com/tech-policy/2026/08/state-judge-orders-kalshi-to-stop-offering-sports-bets-and-other-wagers/", "source": "rss:Ars Technica", "summary": "Kalshi ordered to stop offering bets in Washington, must implement geofencing.", "content": "A state court in Washington this week ordered Kalshi to stop offering sports gambling and a variety of other wagers on its prediction market. King County Superior Court Judge John McHale issued a preliminary injunction in response to a lawsuit filed against Kalshi by the state of Washington. \"The order requires Kalshi to stop offering, accepting, or facilitating wagers on sports, elections, politics, entertainment, culture, tech and science, or mentions in Washington,\" said a press release yesterday from Washington Attorney General Nick Brown. \"Kalshi must implement an IP address and residency-based geofence by August 19 and a multi-source geofencing solution by September 2. This does not include all the wagers offered on Kalshi, but it includes a substantial part of their business, which in recent years has been increasingly driven by sports wagers.\" Kalshi is not licensed by the state Gambling Commission and is not registered to conduct business in Washington, the court order said. McHale found that Kalshi ads claiming \"that it offers 'legal betting' in Washington state are likely to mislead a reasonable consumer that such gambling activities are legal under state law.\" Read full article Comments", "author": "Jon Brodkin", "published_at": "2026-08-14T17:13:14+00:00", "read": false, "starred": false, "full": true}, {"title": "PBS station fears losing 50TB of data after being ghosted by cloud storage provider", "category": "news", "url": "https://arstechnica.com/information-technology/2026/08/pbs-station-fears-losing-50tb-of-data-after-being-ghosted-by-cloud-storage-provider/", "source": "rss:Ars Technica", "summary": "\"We don't have access to the data on the hardware/servers,\" Iron Mountain told Ars.", "content": "After its cloud storage provider went defunct, a PBS affiliate decided to sue a data center provider to regain access to 50TB of TV shows, videos, and other data dating back 70 years. As reported this week by Current , a trade newspaper covering public broadcasting, St. Louis affiliate Nine PBS filed a lawsuit against Iron Mountain Data Centers on July 28, seeking access to the data. In the litigation filed in Denver District Court, Nine PBS says that its cloud storage provider, Open Source Storage (OSS), used one of Iron Mountain’s Denver data centers to store the channel’s data. However, OSS is being unresponsive, and Nine PBS says Iron Mountain has refused to release its data. The data in question includes the station’s coverage of the COVID-19 pandemic, East St. Louis’ history, The Great Flood of 1993 , and over 11,000 files, The Denver Post reported in July. The lawsuit claims that “most” of the data is “unique and irreplaceable,” according to the Post. Read full article Comments", "author": "Scharon Harding", "published_at": "2026-08-14T17:03:54+00:00", "read": false, "starred": false, "full": true}, {"title": "Activists try to deliver aid to Palestinians in homes besieged by Israeli settlers", "category": "news", "url": "https://www.bbc.co.uk/news/articles/c1w1ylw0p3no?at_medium=RSS&at_campaign=rss", "source": "rss:BBC World", "summary": "Two families have been trapped in their homes in the occupied West Bank for several days.", "content": "Two families have been trapped in their homes in the occupied West Bank for several days.", "author": "", "published_at": "2026-08-14T17:03:17+00:00", "read": false, "starred": false, "full": false}, {"title": "Thunderbird’s Desktop Calendar Visual Redesign", "category": "tech", "url": "https://blog.thunderbird.net/2026/08/desktop-calendar-a-design-journey/", "source": "rss:Lobsters", "summary": "Comments", "content": "Comments", "author": "blog.thunderbird.net via wonk", "published_at": "2026-08-14T17:03:04+00:00", "read": false, "starred": false, "full": false}, {"title": "Five years after the Taliban swept to power, does the West have any influence?", "category": "news", "url": "https://www.bbc.co.uk/news/articles/cm2gp5g0xngo?at_medium=RSS&at_campaign=rss", "source": "rss:BBC World", "summary": "Five years after the Taliban swept to power, many are asking whether the West has any bargaining chips left", "content": "Five years after the Taliban swept to power, many are asking whether the West has any bargaining chips left", "author": "", "published_at": "2026-08-14T17:00:14+00:00", "read": false, "starred": false, "full": false}, {"title": "Why is Selena Gomez being sued?", "category": "news", "url": "https://www.bbc.co.uk/news/videos/cly58dnde5yo?at_medium=RSS&at_campaign=rss", "source": "rss:BBC World", "summary": "BBC journalist Ana Guerra-Moore looks at why investors who backed Wondermind Global are claiming the pop star failed to fulfil promises.", "content": "BBC journalist Ana Guerra-Moore looks at why investors who backed Wondermind Global are claiming the pop star failed to fulfil promises.", "author": "", "published_at": "2026-08-14T16:59:53+00:00", "read": false, "starred": false, "full": false}, {"title": "France's top court blocks social media ban for under-15s", "category": "news", "url": "https://www.bbc.co.uk/news/articles/cx2vj433xqlo?at_medium=RSS&at_campaign=rss", "source": "rss:BBC World", "summary": "The Constitutional Council says it infringes upon freedom of expression - but President Macron vows to prepare a new draft.", "content": "The Constitutional Council says it infringes upon freedom of expression - but President Macron vows to prepare a new draft.", "author": "", "published_at": "2026-08-14T16:35:06+00:00", "read": false, "starred": false, "full": false}, {"title": "Policy experts: Europe stuck between \"rock and a hard place\" on launch", "category": "news", "url": "https://arstechnica.com/space/2026/08/policy-experts-europe-stuck-between-rock-and-a-hard-place-on-launch/", "source": "rss:Ars Technica", "summary": "It turns out that the economics of rocket reuse are pretty, pretty good.", "content": "A decade ago, SpaceX began to land the first stages of the Falcon 9 rocket with some regularity, but it's only within the last five years that the company has begun flying the rocket dozens and then hundreds of times a year. As a result, SpaceX has very rapidly become responsible for more than three-quarters of all mass launched into orbit. Much of this is the company's Starlink satellites, but due to cost and the lack of alternatives, SpaceX has also stepped up to launch payloads from all comers, including direct competitors such as Amazon, Northrop Grumman, AST Space Mobile, OneWeb, and more. New research is beginning to quantify just how much the introduction of the Falcon 9 rocket, the adoption of reuse, and the vehicle's high cadence have upended the global launch market. Read full article Comments", "author": "Eric Berger", "published_at": "2026-08-14T16:29:21+00:00", "read": false, "starred": false, "full": true}, {"title": "Zambia vote counting resumes after pause over alleged attacks on polling staff", "category": "news", "url": "https://www.bbc.co.uk/news/articles/c5yr8r04edvo?at_medium=RSS&at_campaign=rss", "source": "rss:BBC World", "summary": "The electoral commission said violence had \"resulted in the theft of marked ballot papers\".", "content": "The electoral commission said violence had \"resulted in the theft of marked ballot papers\".", "author": "", "published_at": "2026-08-14T16:28:59+00:00", "read": false, "starred": false, "full": false}, {"title": "Ars Live recap: How can we stop publishers from killing their own games?", "category": "news", "url": "https://arstechnica.com/gaming/2026/08/ars-live-recap-how-can-we-stop-publishers-from-killing-their-own-games/", "source": "rss:Ars Technica", "summary": "The Stop Killing Games movement faces an uphill battle.", "content": "Video Game Preservation: Saving Yesterday's Games for Tomorrow's Players | Ars Live This week, Ars hosted a live discussion with Ross Scott about the Stop Killing Games movement and its ongoing efforts to ensure that games remain playable even after the original publisher shuts down the online servers undergirding them. Scott talked with Ars Technica Senior Gaming Editor Kyle Orland, saying said he felt the situation around long-term game access was already \"intolerable a decade and a half ago\" and that he \"kept hoping someone else would kick this off, [someone] more experienced or knowledgeable, but it felt like nothing was happening.\" Scott said he felt making the effort to organize a movement against the practice was like \"[drawing] the short straw on this, essentially.\" During the conversation, Scott noted how the standard practice of shutting down game access for any reason, at any time, with minimal notice, would seem ludicrous in other areas of life: Read full article Comments", "author": "Kyle Orland", "published_at": "2026-08-14T16:11:37+00:00", "read": false, "starred": false, "full": true}, {"title": "Upcoming Speaking Engagements", "category": "security", "url": "https://www.schneier.com/blog/archives/2026/08/upcoming-speaking-engagements-59.html", "source": "rss:Schneier on Security", "summary": "This is a current list of where and when I am scheduled to speak: I’m speaking, signing books, and participating in panel discussions at LAcon V in Anaheim, California, USA. My full schedule is here . I’m speaking online (via Zoom) at a League of Women Voters event on Tuesday, September 22, 2026, at 5 PM ET. I’m speaking at Elevate Festival in Toronto, Canada. The conference runs September 22–24, 2026; my talk is on Wednesday, September 23. I’m speaking at CanSecWest 2026 in Vancouver, Canada. T", "content": "This is a current list of where and when I am scheduled to speak: I’m speaking, signing books, and participating in panel discussions at LAcon V in Anaheim, California, USA. My full schedule is here . I’m speaking online (via Zoom) at a League of Women Voters event on Tuesday, September 22, 2026, at 5 PM ET. I’m speaking at Elevate Festival in Toronto, Canada. The conference runs September 22–24, 2026; my talk is on Wednesday, September 23. I’m speaking at CanSecWest 2026 in Vancouver, Canada. The conference runs September 30–October 1, 2026; the time of my talk is TBD. I’m speaking at ATTENTION: Democracy, Rebuilt in Montreal, Canada. The event runs October 21–23, 2026, and my talk is on Wednesday, October 21. The list is maintained on this page .", "author": "Bruce Schneier", "published_at": "2026-08-14T16:01:59+00:00", "read": false, "starred": false, "full": true}, {"title": "Judge gives Google one week to fix \"anticompetitive\" app store download in Google Play", "category": "news", "url": "https://arstechnica.com/gadgets/2026/08/google-ordered-to-make-it-easier-to-download-alternative-android-app-stores/", "source": "rss:Ars Technica", "summary": "Third-party app stores are about to become more visible in Google Play.", "content": "Google began offering third-party app store downloads in the Play Store earlier this week, but US District Judge James Donato says the company isn't doing enough. After reviewing the process for accessing the first non-Google store, Donato ruled that Google has added unnecessary \"anticompetitive friction,\" ordering the company to rectify the issues. While Epic and Google are patching things up with a global partnership agreement, the two are still on opposite sides of the antitrust case in the US. Google lost the case in 2023, and the intervening years have been about determining how to implement remedies to address Google's anticompetitive behavior. One of the court's key elements is the requirement that Google include third-party app stores in the Play Store, giving users an easy way to get apps from non-Google sources. Aptoide Games became the first such app store recently. However, Google worked hard to avoid this outcome , attempting to settle with Epic to keep third-party app stores out. When it was forced to admit the Aptoide store under the terms of the ruling, Google didn't exactly put up a banner welcoming third-party app stores. In fact, Judge Donato found in a Thursday hearing that Google's implementation was not good enough, according to The Verge . Read full article Comments", "author": "Ryan Whitwam", "published_at": "2026-08-14T15:46:40+00:00", "read": false, "starred": false, "full": true}, {"title": "R-rated director's cut of X-Files film restores Chris Carter's original horror vision", "category": "news", "url": "https://arstechnica.com/culture/2026/08/r-rated-directors-cut-of-x-files-film-restores-chris-carters-original-horror-vision/", "source": "rss:Ars Technica", "summary": "Chris Carter chats with Ars about the film he originally wanted to make—and why it's more relevant than ever.", "content": "There is a lot of excitement and some trepidation among The X-Files fans about Ryan Coogler's reboot for Hulu, currently in production. While we're waiting, Hulu just released Chris Carter's revamped (and R-rated) director's cut of the 2008 standalone spinoff film The X-Files: I Want to Believe , distinguishable from its predecessor with a slightly different title: The X-Files: I Want to Believe–Vrach Frankenshteyn . (Minor spoilers below but no major reveals.) I Want to Believe received mixed reviews at its release and didn’t exactly light up the box office, but it still grossed $68 million against its $30 million budget. By 2015, the project led to the return of The X-Files as a limited-run TV series, with the six-episode season 10 debuting in 2016. Mulder and Scully were reunited 14 years after the events of season 9 as the FBI reopened the X-Files under Assistant Director Walter Skinner (Mitch Pileggi). The response was strong enough to warrant a follow-up ten-episode season in 2018, focusing on Mulder and Scully’s search for their missing son, William. Read full article Comments", "author": "Jennifer Ouellette", "published_at": "2026-08-14T15:18:22+00:00", "read": false, "starred": false, "full": true}, {"title": "There Is Still No Silver Bullet", "category": "tech", "url": "https://cekrem.github.io/posts/there-is-still-no-silver-bullet/", "source": "rss:Lobsters", "summary": "Comments", "content": "Comments", "author": "cekrem.github.io via gered", "published_at": "2026-08-14T15:18:11+00:00", "read": false, "starred": false, "full": false}, {"title": "Taylor Farms' connections to Trump admin spurs probe into Cyclospora response", "category": "news", "url": "https://arstechnica.com/health/2026/08/taylor-farms-connections-to-trump-admin-spurs-probe-into-cyclospora-response/", "source": "rss:Ars Technica", "summary": "Senator Warren questions whether Taylor Farms' influence swayed Trump admin.", "content": "As Americans cook their vegetables to at least 158°F to kill a diarrheal parasite that has sickened over 24,000 people and killed two this summer, one US Senator is turning up the heat on Health Secretary Robert F. Kenney Jr. over the government's \"calamitous response\" to the record outbreak. In a letter sent Thursday , Elizabeth Warren (D-Mass.) called the federal response to the Cyclospora outbreak \"botched\" and \"marred by missteps.\" She pointedly questioned whether corruption and incompetence within the Trump administration and its clear ties to Taylor Farms—the mammoth produce distributer that sold Mexican-grown iceberg lettuce linked to the outbreak—played a role in the federal government's failures. \"[P]olitical contributions and direct White House lobbying from Taylor Farms... raise urgent questions about the role this influence-peddling may have played in loosening federal food safety oversight and hampering the federal government’s response to the outbreak,\" Warren wrote in the letter. Read full article Comments", "author": "Beth Mole", "published_at": "2026-08-14T15:03:16+00:00", "read": false, "starred": false, "full": true}, {"title": "Qwen 3.8 27B", "category": "news", "url": "https://huggingface.co/Qwen/Qwen3.8-27B-FP8", "source": "rss:Hacker News", "summary": "Article URL: https://huggingface.co/Qwen/Qwen3.8-27B-FP8 Comments URL: https://news.ycombinator.com/item?id=49299605 Points: 1333 # Comments: 759", "content": "Article URL: https://huggingface.co/Qwen/Qwen3.8-27B-FP8 Comments URL: https://news.ycombinator.com/item?id=49299605 Points: 1333 # Comments: 759", "author": "erdaltoprak", "published_at": "2026-08-14T15:00:00+00:00", "read": false, "starred": false, "full": false}, {"title": "Moment €9m worth of art stolen from Italy museum", "category": "news", "url": "https://www.bbc.co.uk/news/videos/cddjlrzd26eo?at_medium=RSS&at_campaign=rss", "source": "rss:BBC World", "summary": "Police released the CCTV footage after the art, which was stolen in March, was recovered.", "content": "Police released the CCTV footage after the art, which was stolen in March, was recovered.", "author": "", "published_at": "2026-08-14T14:56:04+00:00", "read": false, "starred": false, "full": false}, {"title": "OpenAI and Anthropic in price war as Chinese AI rivals gain ground", "category": "news", "url": "https://arstechnica.com/ai/2026/08/openai-and-anthropic-in-price-war-as-chinese-ai-rivals-gain-ground/", "source": "rss:Ars Technica", "summary": "US groups release cheaper models after new challenges to their trillion-dollar ambitions.", "content": "Leading US AI labs such as OpenAI and Anthropic are releasing cheaper models as they fight to retain cost-conscious customers who are switching to cut-price alternatives from Chinese rivals. The price war comes as rising AI bills push companies to curb usage and seek cheaper models, helping Chinese developers including Moonshot and DeepSeek make inroads with users from Silicon Valley to Europe. OpenAI recently said that it was slashing prices for GPT-5.6 Luna, its “fastest and most affordable model”, by 80 percent. Anthropic has launched Claude Opus 5, touting the system’s “frontier intelligence... at half the price” of Fable 5, the company’s most capable model. Read full article Comments", "author": "Jamie John", "published_at": "2026-08-14T14:27:14+00:00", "read": false, "starred": false, "full": true}, {"title": "Builders unearth €9m gold stash sealed in walls of Belgian property", "category": "news", "url": "https://www.bbc.co.uk/news/articles/c5ydzg0dnz7o?at_medium=RSS&at_campaign=rss", "source": "rss:BBC World", "summary": "Construction workers found the stash in the walls of a cellar while drilling to lay sewage pipes.", "content": "Construction workers found the stash in the walls of a cellar while drilling to lay sewage pipes.", "author": "", "published_at": "2026-08-14T13:18:08+00:00", "read": false, "starred": false, "full": false}, {"title": "Instagram accounts fuelling Ceuta crisis with paid advice for help to cross", "category": "news", "url": "https://www.bbc.co.uk/news/articles/c89n20wj9kko?at_medium=RSS&at_campaign=rss", "source": "rss:BBC World", "summary": "BBC's Top Comment podcast has found a network of Instagram profiles glamourising the swim around the Morocco-Ceuta border fence.", "content": "BBC's Top Comment podcast has found a network of Instagram profiles glamourising the swim around the Morocco-Ceuta border fence.", "author": "", "published_at": "2026-08-14T12:19:21+00:00", "read": false, "starred": false, "full": false}, {"title": "Curl Performance", "category": "tech", "url": "https://daniel.haxx.se/blog/2026/08/14/curl-performance-2/", "source": "rss:Lobsters", "summary": "Comments", "content": "Comments", "author": "daniel.haxx.se via dhruvp", "published_at": "2026-08-14T11:33:57+00:00", "read": false, "starred": false, "full": false}, {"title": "If the Markets Reject OpenAI and Anthropic, the US Should Nationalize Them", "category": "security", "url": "https://www.schneier.com/blog/archives/2026/08/if-the-markets-reject-openai-and-anthropic-the-us-should-nationalize-them.html", "source": "rss:Schneier on Security", "summary": "This essay was written with Nathan E. Sanders, and originally appeared in The Guardian . OpenAI, and then Anthropic , were each formed by AI developers who feared unrestrained corporate AI development—specifically, that companies like Google and Meta would steer the technology towards deleterious, maybe even catastrophically unsafe, outcomes for society. Their founders proclaimed that their new labs, uniquely, could be trusted to develop the technology in humanity’s best interest. But each, in t", "content": "This essay was written with Nathan E. Sanders, and originally appeared in The Guardian . OpenAI, and then Anthropic , were each formed by AI developers who feared unrestrained corporate AI development—specifically, that companies like Google and Meta would steer the technology towards deleterious, maybe even catastrophically unsafe, outcomes for society. Their founders proclaimed that their new labs, uniquely, could be trusted to develop the technology in humanity’s best interest. But each, in turn, were themselves co-opted by the same market incentives, themselves becoming corporate behemoths zealously guarding future investor value rather than the public interest. It was only a few weeks ago, in June, when OpenAI and Anthropic each filed for their IPOs and were met with buzz about trillion-dollar valuations. The hype around their valuations is so extreme that many worry about their potential for concentrating wealth on a global scale. In an effort to leave something for the rest of us, some observers have proposed that the federal government seize a share of these companies’ stock to create a US sovereign wealth fund , or redistribute their revenues to produce a dividend for taxpayers. Now the headlines are about public backlash to AI datacenters and the AI chip giant Nvidia’s slumping stock. The tech and AI giant SpaceX’s newly minted stock price tanked just weeks after its IPO. There are even questions about whether the leading AI labs will ever be sustainably profitable ", "author": "Bruce Schneier", "published_at": "2026-08-14T11:03:50+00:00", "read": false, "starred": false, "full": true}, {"title": "Rocket Report: Rocket Lab shows off its flexibility; Blue Origin's two-pad plan", "category": "news", "url": "https://arstechnica.com/space/2026/08/rocket-report-rocket-lab-shows-off-its-flexibility-blue-origins-two-pad-plan/", "source": "rss:Ars Technica", "summary": "\"We’ve never seen launch capacity so constrained.\"", "content": "Welcome to Edition 9.06 of the Rocket Report! Rocket Lab made a lot of news this week with its quarterly update, and it is clear the company is making impressive progress as it becomes much more than a launch company. But at the end of the day, a lot of the company's success is predicated on the Neutron vehicle, and I'm not thrilled with Rocket Lab's ambiguity around its readiness. As a user on X noted , the company's language on Stage 2 being ready to ship to the launch site has not changed much in 12 months. As always, we welcome reader submissions , and if you don't want to miss an issue, please subscribe using the box below (the form will not appear on AMP-enabled versions of the site). Each report will include information on small-, medium-, and heavy-lift rockets as well as a quick look ahead at the next three launches on the calendar. Rocket Lab decides to get flexible . Rocket Lab plans to start launching its Electron vehicle even more frequently and flexibly, thanks to a new portable spaceport system called GHOST, Space.com reports . GHOST—short for \"Global Hypersonic & Orbital Spaceport Technology\"—turns the company's \"Electron and HASTE rockets into a launch-anywhere, launch-anytime capability for multi-launch flight campaigns and critical national security missions,\" the company said this week. Read full article Comments", "author": "Eric Berger", "published_at": "2026-08-14T11:00:49+00:00", "read": false, "starred": false, "full": true}, {"title": "Samsung Galaxy Z Fold 8 Ultra review: The ultra foldable with an ultra price", "category": "news", "url": "https://arstechnica.com/gadgets/2026/08/samsung-galaxy-z-fold-8-ultra-review-the-ultra-foldable-with-an-ultra-price/", "source": "rss:Ars Technica", "summary": "Samsung didn't have to change much this year because its hardware is just that good.", "content": "Samsung has largely defined the foldable phone category, but it's no longer alone in releasing flexible devices. Google, Motorola, and a raft of Chinese OEMs have their own take on this form factor. Is the new Galaxy Z Fold 8 Ultra really \"ultra\" enough to remain on top? This phone doesn't have the wide frame of the new Z Fold 8 , instead matching the approximate size and shape of the company’s last few tablet-style foldables. The Z Fold 8 Ultra is not a big leap, but it continues Samsung's pattern of iterative foldable improvements. At this point, there's very little left to improve. The compromises of going with a foldable over a regular flat phone have largely been erased with the Z Fold 8 Ultra. Well, except for the price. Flatter and a little better Foldables used to be real pocket-busters, almost like carrying two phones glued together. Samsung has successively shaved a few millimeters off every year, taking a leap last year with the Z Fold 7. The Z Fold 8 Ultra is even a bit slimmer than that phone, but the difference is basically imperceptible. It still has the same buttons in the same places, including a fingerprint sensor in the power button. Read full article Comments", "author": "Ryan Whitwam", "published_at": "2026-08-14T11:00:05+00:00", "read": false, "starred": false, "full": true}, {"title": "'Unprecedented' rain in Japan kills eight people", "category": "news", "url": "https://www.bbc.co.uk/news/articles/cq561gpen8lo?at_medium=RSS&at_campaign=rss", "source": "rss:BBC World", "summary": "The storm cut power to more than 20,000 households and left 7,000 people stranded at Tokyo's Narita airport.", "content": "The storm cut power to more than 20,000 households and left 7,000 people stranded at Tokyo's Narita airport.", "author": "", "published_at": "2026-08-14T10:36:14+00:00", "read": false, "starred": false, "full": false}, {"title": "The Art of CHIP-8", "category": "tech", "url": "https://beyondloom.com/blog/artofchip8.html", "source": "rss:Lobsters", "summary": "Comments
