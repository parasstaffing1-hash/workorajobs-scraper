version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: workora-db
    environment:
      POSTGRES_DB: workora
      POSTGRES_USER: workora
      POSTGRES_PASSWORD: ${DB_PASSWORD:-workora_secure_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workora"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: workora-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: workora-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: .
    container_name: workora-api
    command: python -m scripts.workora_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./jobs.db:/app/jobs.db
      - ./layoffs.db:/app/layoffs.db
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  scraper:
    build: .
    container_name: workora-scraper
    command: python -m scripts.unified_lead_scraper --rounds 999 --backends curl,jobspy,everjobs
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./jobs.db:/app/jobs.db
      - ./logs:/app/logs
    restart: unless-stopped

  scheduler:
    build: .
    container_name: workora-scheduler
    command: python -m scripts.scheduler --run-now
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./jobs.db:/app/jobs.db
    restart: unless-stopped

  monitor:
    image: grafana/grafana:latest
    container_name: workora-monitor
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafanadata:/var/lib/grafana
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  grafanadata:
